let zoom=1,tx=0,ty=0,drag=null,isClosed=false;const map=document.getElementById('map'),vp=document.getElementById('viewport');function fit(){document.querySelector('.screen').style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}onresize=fit;fit();function update(){tx=Math.max(-1190,Math.min(1190,tx));ty=Math.max(-680,Math.min(680,ty));map.setAttribute('transform',`translate(${tx} ${ty}) translate(595 340) scale(${zoom}) translate(-595 -340)`);document.getElementById('zoom').textContent=Math.round(zoom*100)+'%'}function reset(){zoom=1;tx=0;ty=0;update()}function centerPlayer(){tx=-(755-595)*zoom;ty=-(364-340)*zoom;update()}function changeZoom(n){zoom=Math.max(.75,Math.min(2,zoom+n));update()}function closeMap(){isClosed=true;document.getElementById('closed').classList.add('show')}function openMap(){isClosed=false;document.getElementById('closed').classList.remove('show')}document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='m'||k==='escape'){e.preventDefault();isClosed?openMap():closeMap();return}if(isClosed)return;if(['arrowleft','arrowright','arrowup','arrowdown','+','=','-','c','home'].includes(k))e.preventDefault();if(k==='arrowleft')tx+=40;if(k==='arrowright')tx-=40;if(k==='arrowup')ty+=40;if(k==='arrowdown')ty-=40;if(k==='+'||k==='=')changeZoom(.25);if(k==='-')changeZoom(-.25);if(k==='c')centerPlayer();if(k==='home')reset();update()});vp.onwheel=e=>{e.preventDefault();changeZoom(e.deltaY<0?.25:-.25)};vp.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,tx,ty};vp.setPointerCapture(e.pointerId)};vp.onpointermove=e=>{if(!drag)return;const scale=Math.min(innerWidth/1920,innerHeight/1080);tx=drag.tx+(e.clientX-drag.x)/scale;ty=drag.ty+(e.clientY-drag.y)/scale;update()};vp.onpointerup=()=>drag=null;vp.onpointercancel=()=>drag=null;
