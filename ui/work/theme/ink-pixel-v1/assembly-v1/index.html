<!doctype html><html lang="ko"><meta charset="utf-8"><title>Deviant 가방·장비 조립 검토</title><style>
@font-face{font-family:Kkuk;src:url(fonts/MemomentKkukkukk.ttf)}*{box-sizing:border-box}body{margin:0;background:#202227;color:#e7e3db;font-family:Kkuk,'Apple SD Gothic Neo',sans-serif}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}button:focus-visible{outline:2px solid #739cad;outline-offset:5px}.shell{max-width:1600px;margin:auto;padding:55px 7vw 35px;min-height:900px}header{display:flex;gap:40px;align-items:center;margin-bottom:60px}header button{font-size:36px;color:#898b90}header button.on{color:#f2eee4}header small{margin-left:auto;color:#a3a8ad;font-size:18px}.layout{display:grid;grid-template-columns:1.05fr 1fr;gap:80px}.left h2,.right h2{font-size:24px;font-weight:normal;color:#bac1c8;margin:0 0 30px}.weapon{font-size:27px;margin-bottom:40px}.muted{color:#8b929a}.stamps{font-size:25px;line-height:2.1;margin-bottom:55px}.slots{display:flex;gap:12px;align-items:center}.slot{width:100px;text-align:center;flex-shrink:0}.layers{height:95px;position:relative}.layer{position:absolute;inset:0;display:block;width:100%;height:100%;filter:url(#alpha)}.paint{transform:translate(3px,2px) scale(.86)}.effect{position:absolute;width:34px;height:34px;left:calc(50% - 17px);top:calc(50% - 17px);image-rendering:pixelated}.slot small{display:block;font-size:22px;padding-top:10px}.slot.focus:after,.jar.focus:after{content:'';display:block;width:55%;height:6px;background:#739cad;clip-path:polygon(4% 10%,96% 0,100% 60%,95% 100%,0 90%);margin:8px auto}.slotrow{margin:35px 0}.right h3{font-size:34px;color:#e7b3b5;margin:0 0 20px}.right p{font-size:25px;line-height:1.55;margin:8px 0}.detail{min-height:200px}.divider{height:1px;background:#666b72;margin:30px 0 32px}.candidates{display:flex;align-items:center;gap:12px;margin:35px 0 28px}.jar{position:relative;width:95px;height:115px;flex-shrink:0}.jar svg{height:90px;width:95px}.baggrid{display:grid;grid-template-columns:repeat(5,1fr);gap:28px 20px;margin-top:35px}.baggrid .jar{width:100%;height:135px}.baggrid .jar svg{width:100%;height:110px}.previewjar{width:180px;height:180px;margin:25px 0}.footer{font-size:21px;text-align:right;margin-top:70px;color:#bfc3c7}.review{border-top:1px solid #444a50;padding-top:20px;margin-top:50px;font-size:17px;color:#a6afb7}.review button{padding:8px 14px;border:1px solid #4e5862;margin:6px}.matrix{display:grid;grid-template-columns:180px repeat(5,1fr);align-items:center;gap:20px;margin-top:30px}.matrix .slot{width:110px}.hidden{display:none!important}.count{font-size:19px;color:#a7adb6}.hint{font-size:16px;color:#8e98a1;margin-top:20px} @media(max-width:1000px){.shell{padding:30px}.layout{gap:35px}.slot{width:75px}.layers{height:75px}.right p{font-size:21px}.stamps{font-size:22px}}
</style><svg width="0" height="0" style="position:absolute"><filter id="alpha" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncA type="discrete" tableValues="0 0 0 0 1"/></feComponentTransfer></filter></svg>
<div class="shell"><header><button id="bagTab">가방</button><button id="equipTab" class="on">장비</button><button id="matrixTab">팔레트 비교</button><small>이미지 조립 검토 · Unity 미적용</small></header><main id="view"></main><aside class="review">검토용: <button id="fontBtn">첨부 폰트 / 기본 글꼴</button><button id="neutralBtn">일반 칸 / 무색 칸</button><span id="status"></span><div class="hint">첨부 폰트 파일은 로컬에만 포함됩니다. 후보·장착·버리기 동작은 게임에 반영되지 않습니다. 문양은 저장소 원본을 참조합니다.</div></aside></div>
<script>
const manifest=[{"id": "base-red", "file": "assets/base-red.png", "canvas": [1254, 1254], "visibleBounds": [199, 329, 1084, 949], "rgba": "RGBA", "alphaRange": [0, 255]}, {"id": "paint-red", "file": "assets/paint-red.png", "canvas": [1254, 1254], "visibleBounds": [192, 347, 1075, 982], "rgba": "RGBA", "alphaRange": [0, 255]}, {"id": "base-yellow", "file": "assets/base-yellow.png", "canvas": [1254, 1254], "visibleBounds": [205, 338, 1052, 950], "rgba": "RGBA", "alphaRange": [0, 255]}, {"id": "paint-yellow", "file": "assets/paint-yellow.png", "canvas": [1254, 1254], "visibleBounds": [155, 268, 1091, 955], "rgba": "RGBA", "alphaRange": [0, 255]}, {"id": "base-green", "file": "assets/base-green.png", "canvas": [1254, 1254], "visibleBounds": [186, 311, 1055, 977], "rgba": "RGBA", "alphaRange": [0, 255]}, {"id": "paint-green", "file": "assets/paint-green.png", "canvas": [1254, 1254], "visibleBounds": [212, 372, 1020, 908], "rgba": "RGBA", "alphaRange": [0, 255]}, {"id": "base-blue", "file": "assets/base-blue.png", "canvas": [1254, 1254], "visibleBounds": [183, 338, 1070, 916], "rgba": "RGBA", "alphaRange": [0, 255]}, {"id": "paint-blue", "file": "assets/paint-blue.png", "canvas": [1254, 1254], "visibleBounds": [182, 404, 1066, 875], "rgba": "RGBA", "alphaRange": [0, 255]}, {"id": "base-purple", "file": "assets/base-purple.png", "canvas": [1254, 1254], "visibleBounds": [228, 332, 1058, 931], "rgba": "RGBA", "alphaRange": [0, 255]}, {"id": "paint-purple", "file": "assets/paint-purple.png", "canvas": [1254, 1254], "visibleBounds": [233, 373, 1024, 934], "rgba": "RGBA", "alphaRange": [0, 255]}, {"id": "base-neutral", "file": "assets/base-neutral.png", "canvas": [1254, 1254], "visibleBounds": [243, 343, 1016, 967], "rgba": "RGBA", "alphaRange": [0, 255]}, {"id": "ink-jar-red", "file": "assets/ink-jar-red.png", "canvas": [1254, 1254], "visibleBounds": [354, 333, 900, 966]}];const byId=Object.fromEntries(manifest.map(a=>[a.id,a]));
const colors=['red','yellow','green','blue','purple'],names=['빨강','노랑','초록','파랑','보라'];
const effects=['ink3_red_01','ink3_yellow_02','ink3_green_04','ink3_blue_01','ink3_purple_01'];
let tab=new URLSearchParams(location.search).get('view')||'equipment',neutral=false,selected=0,page=0,custom=true;
function sprite(id,cls=''){let a=byId[id],b=a.visibleBounds;return `<svg class="${cls}" viewBox="${b[0]} ${b[1]} ${b[2]-b[0]} ${b[3]-b[1]}" preserveAspectRatio="xMidYMid meet"><image href="${a.file}" width="${a.canvas[0]}" height="${a.canvas[1]}"/></svg>`}
function slot(c,filled=true,n=false,i=0){return `<div class="slot"><div class="layers">${sprite('base-'+(n?'neutral':c),'layer')}${filled?sprite('paint-'+c,'layer paint')+`<img class="effect" alt="효과" src="assets/effect-${effects[colors.indexOf(c)]}.png">`:''}</div><small>+0</small></div>`}
function jar(i){return `<button class="jar ${i===selected?'focus':''}" onclick="selected=${i};render()" aria-label="덧칠 ${i+1}">${sprite('ink-jar-red')}</button>`}
function render(){document.querySelectorAll('header button').forEach(b=>b.classList.remove('on'));document.getElementById(tab==='bag'?'bagTab':tab==='matrix'?'matrixTab':'equipTab').classList.add('on');let v=document.getElementById('view');
if(tab==='matrix'){v.innerHTML=`<h2>같은 칠 원본을 재사용한 비교</h2><div class="matrix"><span></span>${names.map(n=>`<span>${n}</span>`).join('')}<span>빈 색상 칸</span>${colors.map(c=>slot(c,false)).join('')}<span>색상 칸에 장착</span>${colors.map(c=>slot(c)).join('')}<span>무색 칸에 장착</span>${colors.map(c=>slot(c,true,true)).join('')}</div>`;return}
if(tab==='bag'){v.innerHTML=`<div class="layout"><section><h2>보관 3 / 15</h2><div class="baggrid">${[0,1,2].map(jar).join('')}</div></section><section class="right"><h3>덧칠</h3><span class="muted">1등급</span><div class="previewjar">${sprite('ink-jar-red')}</div><div class="divider"></div><p>적중 시 추가 타격</p><p>원래 피해의 20%</p><p class="muted">재발동 간격 0.25초</p></section></div><div class="footer">X 버리기　　X 3초 눌러 파괴</div>`;return}
v.innerHTML=`<div class="layout"><section class="left"><div class="weapon">기본검　 <span class="muted">기본망치</span></div><div class="stamps">무기 도장　<span style="font-family:sans-serif">—</span><br>특수 도장　<span style="font-family:sans-serif">—</span></div><h2>팔레트</h2><div class="slots">${colors.map((c,i)=>slot(c,i!==2,neutral)).join('')}</div></section><section class="right"><div class="detail"><h2>현재 장착</h2><h3>덧칠</h3><p class="muted">1번 칸 · ${neutral?'무색':'빨강'} · 강화 +0</p><p>적중 시 원래 피해의 20% 추가 타격</p><p class="muted">재발동 간격 0.25초</p></div><div class="divider"></div><h2>교체할 잉크</h2><div class="candidates"><button onclick="page=0;selected=0;render()" ${page===0?'disabled':''} aria-label="이전 후보">◀</button>${[page*2,page*2+1].filter(i=>i<3).map(jar).join('')}<button onclick="page=1;selected=2;render()" ${page===1?'disabled':''} aria-label="다음 후보">▶</button><span class="count">${page===0?'1~2':'3'} / 3</span></div><h3>덧칠 · 1등급</h3><p>적중 시 원래 피해의 20% 추가 타격</p><p class="muted">재발동 간격 0.25초</p></section></div><div class="footer">F 교체 확정　　Esc 이전 단계</div>`}
bagTab.onclick=()=>{tab='bag';render()};equipTab.onclick=()=>{tab='equipment';render()};matrixTab.onclick=()=>{tab='matrix';render()};neutralBtn.onclick=()=>{neutral=!neutral;render()};fontBtn.onclick=()=>{custom=!custom;document.body.style.fontFamily=custom?'Kkuk, sans-serif':'sans-serif'};render();
</script></html>
