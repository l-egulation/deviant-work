<!doctype html><meta charset="utf-8"><title>잉크 36종 대응 검토</title><style>body{margin:40px;background:#25292d;color:#eee9df;font:18px/1.7 sans-serif}h1{font-size:30px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}article{padding:24px;background:#30353a}article>svg{width:105px;height:155px;float:left;margin-right:20px}small{display:block;overflow-wrap:anywhere;color:#adc2cf}p{clear:both;padding-top:14px}.archived{opacity:.6}a{color:#b6d7e4}</style><h1>현행 잉크 36종 · 승인 에셋 대응</h1><p>재사용 36 · 보존 전용 7 · 신규 원화 필요 0. 병 중앙=효과 / 우측 아래=조건. 기존 중독 문양은 보존만 합니다.</p><a href="mapping.csv">전체 ID 대응표</a><main></main><script src="../unity-handoff-v1/manifest.js"></script><script>
let n=0;const sprite=id=>PACKAGE.sprites.find(x=>x.id===id);function art(s){const id='c'+n++;return `<svg viewBox="${s.view.join(' ')}"><defs><clipPath id="${id}"><rect x="${s.rect[0]}" y="${s.rect[1]}" width="${s.rect[2]}" height="${s.rect[3]}"/></clipPath></defs><image clip-path="url(#${id})" href="../unity-handoff-v1/${s.file}" width="${s.imageSize[0]}" height="${s.imageSize[1]}"/></svg>`}function bottle(x){let h=art(sprite(x.bottle)),layers='';for(const [id,pos] of [[x.effect,x.label],[x.condition,x.badge]]){let g=art(sprite(id)).replace('<svg ',`<svg x="${pos.center[0]-pos.size/2}" y="${pos.center[1]-pos.size/2}" width="${pos.size}" height="${pos.size}" `);layers+=g}return h.replace('</svg>',layers+'</svg>')}document.querySelector('main').innerHTML=[...PACKAGE.inks,...PACKAGE.archivedInks].map(x=>`<article class="${PACKAGE.archivedInks.includes(x)?'archived':''}">${bottle(x)}<h2>${x.name}</h2><small>${x.id}</small><p>${x.description}</p><small>${x.effect} / ${x.condition}<br>${PACKAGE.archivedInks.includes(x)?'보존 전용 · 현행 제외':'현행 · 재사용'}</small></article>`).join('');</script>
