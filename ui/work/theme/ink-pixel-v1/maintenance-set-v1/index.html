<!doctype html><html lang="ko"><meta charset="utf-8"><title>Deviant 정비소 테마</title><style>
@font-face{font-family:Kkuk;src:url(../assembly-v1/fonts/MemomentKkukkukk.ttf)}*{box-sizing:border-box}body{margin:0;background:#25272c;color:#eee9df;font-family:Kkuk,sans-serif}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}button:focus-visible{outline:2px solid #9ac7d7;outline-offset:8px}.screen{width:1920px;height:1080px;position:relative;transform-origin:0 0;overflow:hidden}.world{position:absolute;inset:0;background:linear-gradient(#24262bf0,#24262bea),url(assets/village.jpg) center/cover;filter:blur(1px)}main{position:relative;margin:0 150px;padding-top:85px}header{height:72px;display:flex;align-items:center;gap:28px}h1{font-size:43px;font-weight:normal;margin:0}header .meta{font-size:23px;color:#a7adb5}header .right{margin-left:auto;display:flex;align-items:center;gap:42px;font-size:25px}kbd{font:inherit;font-size:22px;border:1px solid #999da3;border-radius:5px;padding:4px 10px;margin-right:12px}nav{display:flex;gap:48px;align-items:center;margin-top:44px;font-size:29px;color:#9da4ae}nav button{padding:0 5px 8px}nav .active{color:#eee9df}.swash{position:relative}.swash:after{content:'';position:absolute;height:12px;bottom:-5px;left:0;right:0;background:url(assets/selection-swash.png) center/100% 100% no-repeat}nav .new{color:#9ac7d7;font-size:19px;margin-left:12px}.layout{display:grid;grid-template-columns:710px 1fr;gap:122px;margin-top:55px}.choices{display:flex;flex-direction:column;gap:28px}.choice{width:100%;height:132px;display:flex;align-items:center;gap:28px;padding:10px 8px;border-bottom:1px solid #a3a6a82d}.choice .icon{width:96px;height:96px;object-fit:contain;image-rendering:pixelated}.choice h2{font-size:32px;font-weight:normal;margin:0 0 10px}.choice p{font-size:23px;color:#a8afb6;margin:0}.price{margin-left:auto;font-size:30px}.choice.selected h2{color:#a7ced8}.choice.selected{border-bottom:0}.slot-icon{width:96px;height:76px;position:relative;flex-shrink:0}.slot-icon img{position:absolute;width:96px;height:68px;image-rendering:pixelated}.label{color:#a8afb6;font-size:24px;margin:0 0 24px}.hero{display:flex;align-items:center;gap:32px;min-height:180px}.hero img{width:144px;height:166px;object-fit:contain;image-rendering:pixelated}.hero h2{font-size:40px;font-weight:normal;margin:0 0 20px}.hero p{font-size:24px;color:#a8afb6;margin:0}.rule{height:1px;background:#a3a6a842;margin:28px 0}.body{font-size:28px;line-height:1.65;margin:0}.muted{color:#a8afb6}.detailrow{display:flex;justify-content:space-between;font-size:25px;margin-top:22px}.next{font-size:23px;color:#a8afb6;margin-top:12px}.action{display:block;width:max-content;max-width:100%;margin-top:38px;padding:18px 0;font-size:30px;position:relative}.action:after{content:'';position:absolute;bottom:0;height:10px;left:0;right:0;background:url(assets/selection-swash.png) left/100% 100% no-repeat}.action kbd{font-size:25px}.foot{position:absolute;left:150px;right:150px;bottom:74px;display:flex;gap:30px;font-size:23px;color:#adb4bc}.foot .note{margin-left:auto;color:#858e98;font-size:20px}.result{display:grid;grid-template-columns:650px 1fr;gap:120px;margin-top:56px}.resultVisual{display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:430px}.resultVisual>img{width:222px;height:256px;image-rendering:pixelated}.resultVisual .caption{font-size:24px;color:#9ac7d7;margin-top:30px}.result h2{font-weight:normal;font-size:43px;color:#e5a6a7;margin:0 0 12px}.receipt{margin-top:28px;display:flex;justify-content:space-between;font-size:26px}.status{font-size:27px;color:#b9d6c4;margin:28px 0 0}.small{font-size:23px}.disabled{opacity:.45}button:hover{color:#fff}
.resultInfo{max-width:650px;padding-top:22px}.result .rule{margin:30px 0}.result .body{max-width:570px}.resultSummary{margin-top:36px;display:flex;align-items:center;gap:28px}.resultSummary .status{margin:0;font-size:25px}.spent{font-size:21px}.result .action{margin-top:34px;padding:14px 8px 16px}.resultVisual{min-height:490px}.resultOutcome{margin-top:64px;padding-top:28px;border-top:1px solid #a8afb660;display:flex;justify-content:space-between;align-items:center;gap:32px}.resultOutcome .resultSummary{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:12px}.resultOutcome .action{margin:0;flex-shrink:0}.resultOutcome .status{font-size:25px;color:#b9d6c4}.resultOutcome .spent{font-size:23px}.result{width:1040px;margin:88px auto 0;grid-template-columns:280px 1fr;column-gap:72px;row-gap:48px;align-items:center}.resultVisual{min-height:0}.resultInfo{padding:0;max-width:none}.resultInfo .label{margin:0 0 16px}.resultInfo .small{margin:16px 0 0}.resultInfo .rule{margin:24px 0}.resultOutcome{grid-column:1/-1;margin:0;padding-top:24px}.resultOutcome .resultSummary{gap:10px}.new-dot{display:inline-block;width:16px;height:16px;background:url(assets/new-item-dot.png) center/16px 16px no-repeat;image-rendering:pixelated;margin-left:10px;vertical-align:top;margin-top:5px}</style><div class="screen"><div class="world"></div><main><header><h1>정비소</h1><div class="right"><span id="gold"></span><span><kbd>Esc</kbd>닫기</span></div></header><nav><kbd>Q</kbd><button class="active swash" onclick="location.search='?view=growth'">성장</button><button>팔레트<span id="badge"></span></button><button>스탬프</button><kbd>E</kbd></nav><div id="content"></div></main><div class="foot"><span id="keys"></span><span class="note">테마 시안 · 수치 예시</span></div></div>
<script>
let result=new URLSearchParams(location.search).get('view')==='result';let selected=new URLSearchParams(location.search).get('item')||'draw';
const options={draw:{name:'잉크 뽑기',desc:'색상 잉크 1개 · 무작위',price:'40 G',next:'다음 뽑기 60 G',img:'ink3_red_01-jar.png',body:'무작위 색상 잉크를 하나 얻습니다.',extra:'가방 빈 칸 3',hint:'가방이 가득 차면 뽑을 수 없습니다.',action:'뽑기 · 40 G'},attack:{name:'공격 강화',desc:'두 무기 공격력 강화',price:'60 G',next:'다음 강화 90 G',img:'weapon-base_sword.png',body:'두 무기의 공격력을 강화합니다.',extra:'Lv 1 → Lv 2',hint:'공격력 +5% · 이번 런에 적용',action:'길게 눌러 강화 · 60 G'},slot:{name:'슬롯 강화',desc:'팔레트 칸을 골라 강화',price:'선택',next:'선택한 칸에 따라 비용이 표시됩니다.',img:'filled-red.png',body:'강화할 팔레트 칸을 선택합니다.',extra:'무기별 팔레트 관리',hint:'칸을 선택한 뒤 효과와 비용을 확인합니다.',action:'팔레트 관리로'}};
function render(){gold.textContent='보유 골드 '+(result?'80 G':'120 G');badge.className='new';badge.textContent='';badge.className=result?'new-dot':'';badge.setAttribute('aria-label',result?'새로 획득한 잉크 있음':'');keys.innerHTML=result?'':'<kbd>↑ ↓</kbd>항목 선택';if(result){content.innerHTML=`<div class="result"><div class="resultVisual"><img src="assets/ink3_red_01-jar.png" alt="덧칠 잉크"></div><section class="resultInfo"><p class="label">획득한 잉크</p><h2>덧칠</h2><p class="muted small">빨강 · 색상 잉크 · 1등급</p><div class="rule"></div><p class="body">원공격 피해의 20%인 추가타 1회를 가한다.</p><p class="muted small">재발동 간격 0.25초</p></section><footer class="resultOutcome"><div class="resultSummary" role="status"><p class="status">가방에 보관 완료</p><span class="muted spent">사용한 골드 −40 G</span></div><button class="action" onclick="location.search='?view=growth'"><kbd>F</kbd>확인</button></footer></div>`;return;}let d=options[selected];content.innerHTML=`<div class="layout"><section class="choices">${Object.entries(options).map(([k,x])=>`<button class="choice ${k===selected?'selected swash':''}" onclick="selected='${k}';render()"><img class="icon" src="assets/${x.img}"><div><h2>${x.name}</h2><p>${x.desc}</p></div><span class="price">${x.price}</span></button>`).join('')}</section><section><p class="label">${d.name}</p><div class="hero"><img src="assets/${d.img}"><div><h2>${selected==='draw'?'색상 잉크 1개':selected==='attack'?'Lv 1 → Lv 2':'팔레트 칸 강화'}</h2><p>${selected==='draw'?'색상과 효과는 무작위':d.desc}</p></div></div><div class="rule"></div><p class="body">${d.body}</p><div class="detailrow"><span class="muted">${selected==='draw'?'보관 공간':'강화 대상'}</span><span>${d.extra}</span></div><p class="next">${d.hint}</p><button class="action" onclick="${selected==='draw'?"location.search='?view=result'":"void(0)"}"><kbd>F</kbd>${d.action}</button><p class="next">${d.next}</p></section></div>`}
function fit(){document.querySelector('.screen').style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key.toLowerCase()==='f' && (result||selected==='draw')){e.preventDefault();location.search=result?'?view=growth':'?view=result';}if(!result && ['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const a=['draw','attack','slot'];selected=a[(a.indexOf(selected)+(e.key==='ArrowDown'?1:2))%3];render();}});onresize=fit;fit();render();
</script></html>
