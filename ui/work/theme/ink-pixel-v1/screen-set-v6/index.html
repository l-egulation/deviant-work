const name=ranged?'발사기':rapier?'레이피어':'기본검';
const description=ranged?'직선으로 볼 탄환을 쏘는 원거리 무기입니다.':rapier?'좁은 전방을 빠르게 찌르는 검입니다. 3연속 공격으로 적을 압박합니다.':'전방을 베는 근접 무기입니다. 두 번의 베기를 이어 공격합니다.';
const skill=ranged?'모아쏘기':rapier?'장침':'강베기';
const skillDescription=ranged?'힘을 모아 탄환을 발사합니다. 충전 단계에 따라 피해가 커지고, 적에게 맞으면 주변에도 범위 피해를 줍니다.':rapier?'전방으로 긴 찌르기를 펼쳐 경로에 있는 모든 적을 한 번씩 공격합니다. 고체 지형 너머의 적에게는 닿지 않습니다.':'전방의 넓은 범위를 강하게 베어 범위 안의 적을 공격합니다.';
return `<div class="weaponInfo"><section><div class="infoHeading">무기 <span>${rapier?'무기 스탬프 · 레이피어':'기본 형태'}</span></div><h2>${name}</h2><p>${description}</p><div class="attackNote">기본 공격 · ${ranged?'볼 탄환':rapier?'3연속 찌르기':'2연속 베기'}</div></section><div class="rule"></div><section><div class="infoHeading">스킬 <span>${rapier?'스킬 스탬프 · 범위':'기본 특수 공격'}</span></div><h2>${skill}</h2><p>${skillDescription}</p><div class="attackNote">기본 재사용 대기시간 · ${ranged?'6':rapier?'7':'5'}초</div></section></div>`;
}

document.addEventListener('keydown',e=>{if(view!=='equipment'||e.repeat)return;if(!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();if(e.key==='ArrowDown'){stamp='';page=0}else if(e.key==='ArrowUp'){stamp='weapon'}else if(stamp){weapon=1-weapon}else{slot=(slot+(e.key==='ArrowRight'?1:4))%5;page=0}render()});
function movePage(delta){page+=delta;let c=slotColors[slot];let a=candidatesForSlot();page=Math.max(0,Math.min(page,Math.max(0,Math.ceil(a.length/4)-1)));selected=a[page*4]?.index??selected;render()}bag.onclick=()=>{view='bag';render()};equip.onclick=()=>{view='equipment';selected=1;stamp='weapon';render()};function fit(){document.querySelector('.screen').style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}onresize=fit;fit();render();if(new URLSearchParams(location.search).get('result')==='done')applyInk();
if(new URLSearchParams(location.search).get('scroll')==='bottom')document.querySelector('.grid')?.scrollTo(0,9999);</script></html><script src="../review-font.js"></script>
