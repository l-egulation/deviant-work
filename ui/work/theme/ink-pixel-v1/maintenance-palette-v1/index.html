<!doctype html><html lang="ko"><meta charset="utf-8"><title>Deviant 정비소 · 팔레트</title><style>
@font-face{font-family:Kkuk;src:url(../assembly-v1/fonts/MemomentKkukkukk.ttf)}*{box-sizing:border-box}body{margin:0;background:#24262b;color:#eee9df;font-family:Kkuk,sans-serif}button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-decoration:none}button{padding:0;text-align:left}button:focus-visible,a:focus-visible{outline:2px solid #9ac7d7;outline-offset:7px}button:disabled{cursor:default;color:#7e858e}img{image-rendering:pixelated;object-fit:contain}.screen{position:relative;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}.world{position:absolute;inset:0;background:linear-gradient(#24262bf0,#24262bea),url(../screen-set-v6/assets/village.jpg) center/cover;filter:blur(1px)}main{position:relative;margin:0 150px;padding-top:85px}header{display:flex;align-items:center;height:72px}h1{font-size:43px;font-weight:normal;margin:0}header aside{margin-left:auto;font-size:25px;display:flex;gap:40px}kbd{font:inherit;font-size:22px;border:1px solid #999da3;border-radius:5px;padding:4px 10px;margin-right:12px}nav{display:flex;gap:48px;align-items:center;margin-top:44px;font-size:29px;color:#a8afb6}nav .active{color:#eee9df}.mark{position:relative}.mark:after{content:'';position:absolute;left:0;right:0;bottom:-12px;height:10px;background:url(../screen-set-v6/assets/selection-swash.png) center/100% 100% no-repeat}.cols{display:grid;grid-template-columns:720px 1fr;gap:112px;margin-top:64px}.weapons{display:flex;gap:40px;align-items:center}.weapons button{display:flex;gap:18px;align-items:center;font-size:30px}.weapons img{width:96px;height:96px}.weapons .muted{opacity:.6}.label{font-size:24px;color:#a8afb6;margin:0 0 18px}.muted{color:#a8afb6}.paletteHead{margin-top:48px;display:flex;justify-content:space-between;max-width:540px}.slots{display:flex;gap:24px;margin-top:22px}.slot{width:160px;text-align:center}.layers{width:160px;height:114px;position:relative}.layers img{position:absolute;inset:0;width:160px;height:114px}.slot .level{display:block;font-size:25px;margin-top:12px}.slot .name{display:block;font-size:27px;margin-top:12px}.slot.chosen .level{color:#9ac7d7}.slot.chosen .layers:after{content:'';position:absolute;bottom:-3px;left:38px;right:38px;height:8px;background:url(../screen-set-v6/assets/selection-swash.png) center/100% 100% no-repeat}.services{border-top:1px solid #a8afb640;margin-top:42px;padding-top:22px;display:flex;gap:44px}.services p{font-size:24px;margin:0 0 12px}.services small{display:block;font-size:23px;color:#a8afb6}.services .muted{font-size:21px}h2{font-size:36px;font-weight:normal;margin:0 0 16px}p.effect{font-size:27px;line-height:1.55;margin:0;max-width:650px}.current{min-height:140px}.transition{display:flex;align-items:center;gap:20px;margin:20px 0 28px}.transition:before,.transition:after{content:'';height:1px;background:#a8afb660;flex:1}.transition img{width:24px;height:22px}.candidateRow{display:flex;gap:30px;margin:20px 0 24px;min-height:96px;align-items:center}.candidateRow button{width:84px;height:96px;position:relative}.candidateRow img{width:84px;height:96px}.candidateRow .mark:after{bottom:-12px}.candidateTitle{color:#e5a6a7}.action{font-size:29px;padding:12px 0;display:inline-block;margin-top:28px}.feedback{border-top:1px solid #a8afb640;margin-top:20px;padding-top:16px;font-size:23px;color:#b9d6c4}.hint{font-size:23px;color:#a8afb6;margin-top:24px;line-height:1.5}.foot{position:absolute;left:150px;right:150px;bottom:62px;display:flex;gap:32px;font-size:23px}.foot .note{margin-left:auto;color:#919aa5;font-size:21px}.slotDetail{padding-top:10px}.emptyNote{font-size:26px;color:#a8afb6;margin:22px 0}.pending{font-size:22px;color:#919aa5;margin-top:24px}.choiceLink{color:#9ac7d7;font-size:27px;margin-top:36px}.destination{font-size:23px;color:#a8afb6;margin-top:18px}

/* Layout review: keep the composition centered and emphasize the active layer. */
nav .mark:after{opacity:.3}.weapons .mark:after{opacity:.25}
.cols{gap:88px;grid-template-columns:744px 1fr;margin-top:52px}
.paletteHead{margin-top:38px}.services{margin-top:38px}
#detail{position:relative;height:650px}
.current{height:156px;min-height:0}.transition{margin:10px 0 24px}
.candidateRow{height:110px;min-height:110px;gap:34px;margin:16px 0 24px}
.candidateRow button,.candidateRow img{width:96px;height:110px}
p.effect{font-size:28px;line-height:1.5}
.feedback{position:absolute;bottom:0;left:0;right:0;height:70px;padding-top:22px;padding-right:245px;font-size:24px;line-height:1.4}
.action{position:absolute;right:0;bottom:4px;margin:0;color:#acd5df;font-size:28px}
.choiceLink{position:absolute;left:0;bottom:12px;margin:0}
.pending{display:none}.foot{bottom:38px}
body[data-mode="ink"] .slot.chosen .layers:after{opacity:.25}
body[data-mode="ink"] .slot.chosen .level{color:#eee9df}
.services{gap:30px}.services p{font-size:25px}.services small{font-size:23px}
.services button{font-size:25px;line-height:1.7}.services button:hover{color:#acd5df}.services small{margin-top:6px}.serviceInfo{font-size:28px;line-height:1.6;margin-top:36px}.expanded .slots{gap:10px}.expanded .slot{width:138px}.expanded .layers,.expanded .layers img{width:138px;height:108px}.expanded .slot .name{font-size:25px}.expanded .paletteHead{max-width:730px}.slotDetail{padding-top:0}p.effect{word-break:keep-all;overflow-wrap:break-word}</style><div class="screen"><div class="world"></div><main><header><h1>정비소</h1><aside><span>보유 골드 120 G</span><span><kbd>Esc</kbd><span id="escLabel">닫기</span></span></aside></header><nav><a href="../maintenance-set-v1/index.html?view=growth">성장</a><span class="active mark">팔레트</span><span>스탬프</span></nav><div class="cols"><section><div class="weapons" id="weapons"></div><div class="paletteHead"><span class="label">팔레트</span><span class="label" id="slotCount">3칸</span></div><div class="slots" id="slots"></div><div class="services"><button onclick="showService(0)">칸 강화 <small>+0 → +1 · 50 G</small></button><button onclick="showService(1)">칸 색 변경 <small>변경권 1장</small></button></div></section><section id="detail"></section></div></main><footer class="foot"><span><kbd>Tab</kbd>무기</span><span><kbd>← →</kbd>선택</span><span><kbd>F</kbd><span id="fLabel">잉크 고르기</span></span><span class="note">테마 시안 · 실제 변경 없음</span></footer></div><script>
const A='../screen-set-v6/assets/';const inks=[{id:'ink3_red_01',name:'덧칠',color:'red',desc:'원공격 피해의 20%인 추가타 1회를 가한다.'},{id:'ink3_red_02',name:'집중 공격',color:'red',desc:'같은 몬스터를 연달아 때릴 때마다 그 몬스터에게 주는 피해가 4%씩 오른다. 최대 5중첩(20%)이다.'},{id:'ink3_red_04',name:'터지는 잉크',color:'red',desc:'표식을 터트린 몬스터에게 기준 피해 60%인 추가타 1회를 가한다.'},{id:'ink3_yellow_02',name:'뛰어난 발걸음',color:'yellow',desc:'공격 속도와 이동 속도가 각각 10% 증가한다.'},{id:'ink3_blue_01',name:'범위 증폭',color:'blue',desc:'공격 범위(반경)가 20% 증가한다.'}];const colorNames={red:'빨강',yellow:'노랑',blue:'파랑',green:'초록',purple:'보라'};const expanded=new URLSearchParams(location.search).get('slots')==='5';const colors=expanded?['red','yellow','blue','green','purple']:['red','yellow','blue'];const sets=expanded?[[0,null,null,null,null],[null,null,4,null,null]]:[[0,null,null],[null,null,4]];let mode=new URLSearchParams(location.search).get('state')==='ink'?'ink':'slot',slot=mode==='ink'?0:1,weapon=0,candidate=1;
function available(){return inks.map((d,i)=>({...d,index:i})).filter(d=>d.color===colors[slot]&&d.index!==sets[weapon][slot])}
function setSlot(i){slot=i;mode='slot';render()}function setWeapon(i){weapon=i;mode='slot';render()}function chooseInk(){if(!available().length)return;candidate=available()[0].index;mode='ink';render()}
function render(){document.body.classList.toggle("expanded",expanded);document.getElementById("slotCount").textContent=colors.length+"칸";document.body.dataset.mode=mode;document.getElementById("escLabel").textContent=mode==="ink"?"슬롯 선택으로":"닫기";document.getElementById('weapons').innerHTML=['기본검','발사기'].map((n,i)=>`<button class="${weapon===i?'mark':'muted'}" onclick="setWeapon(${i})"><img src="${A}weapon-${i?'launcher':'base_sword'}.png" alt="">${n}</button>`).join('');document.getElementById('slots').innerHTML=colors.map((c,i)=>{let d=inks[sets[weapon][i]];return `<button class="slot ${slot===i?'chosen':''}" onclick="setSlot(${i})" aria-label="${colorNames[c]} 칸 ${d?d.name:'빈 칸'}"><div class="layers"><img src="${A}${d?'filled':'empty'}-${c}.png" alt="">${d?`<img src="${A}${d.id}.png" alt="">`:''}</div><span class="level">+0</span><span class="name">${d?d.name:'빈 칸'}</span></button>`}).join('');let current=inks[sets[weapon][slot]],d=inks[candidate],list=available();document.getElementById('fLabel').textContent=mode==='slot'?'잉크 고르기':(current?'교체':'장착');document.getElementById('detail').innerHTML=mode==='slot'?`<div class="slotDetail"><div class="current"><p class="label">선택한 칸 · ${colorNames[colors[slot]]}</p><h2>${current?current.name:'빈 칸'}</h2>${current?`<p class="effect">${current.desc}</p>`:''}</div><div class="transition"><img src="${A}transition-down.png" alt=""></div><p class="label">보유한 ${colorNames[colors[slot]]} 잉크</p><div class="candidateRow">${list.map(x=>`<button onclick="candidate=${x.index};mode='ink';render()" aria-label="${x.name}"><img src="${A}${x.id}-jar.png" alt="${x.name}"></button>`).join('')||'<p class="emptyNote">보유한 잉크 없음</p>'}</div><button class="choiceLink" onclick="chooseInk()" ${list.length?'':'disabled'}><kbd>F</kbd>잉크 고르기</button></div>`:`<div class="current"><p class="label">현재 장착 · ${colorNames[colors[slot]]} 칸</p><h2>${current?current.name:'빈 칸'}</h2><p class="effect">${current?current.desc:'장착된 잉크 없음'}</p></div><div class="transition"><img src="${A}transition-down.png" alt="교체 방향"></div><p class="label">${current?'교체할':'장착할'} 잉크</p><div class="candidateRow">${list.map(x=>`<button class="${x.index===candidate?'mark':''}" onclick="candidate=${x.index};render()" aria-label="${x.name}"><img src="${A}${x.id}-jar.png" alt="${x.name}"></button>`).join('')}</div><h2 class="candidateTitle" style="color:${({red:"#e5a6a7",yellow:"#e2ce91",blue:"#9dc6e4"})[d.color]}">${d.name}</h2><p class="effect">${d.desc}</p><div class="feedback">${current?'현재 잉크는 가방으로 돌아갑니다.':'선택한 빈 칸에 장착합니다.'}</div><button class="action" onclick="preview()"><kbd>F</kbd>${current?'교체':'장착'} · 무료</button><span class="pending">　미리보기</span>`}
function showService(i){mode='service';document.body.dataset.mode=mode;document.getElementById('escLabel').textContent='슬롯 선택으로';document.getElementById('fLabel').textContent='—';document.getElementById('detail').innerHTML='<p class="label">선택한 '+colorNames[colors[slot]]+' 칸</p><h2>'+(i?'칸 색 변경':'칸 강화')+'</h2><p class="serviceInfo">'+(i?'무작위 색으로 변경<br>필요 변경권 1장':'+0 → +1<br>필요 골드 50 G')+'</p><p class="hint">거래 상세는 다음 시안에서 확인합니다.</p>';}
function preview(){document.querySelector('.feedback').textContent='시안 확인 완료 · 실제 아이템은 변경하지 않았습니다.'}
document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='Tab'){e.preventDefault();setWeapon(1-weapon)}if(e.key==='Escape'){e.preventDefault();if(mode!=='slot'){mode='slot';render()}else{document.querySelector('main').hidden=true;document.querySelector('.foot').innerHTML='<button onclick="location.reload()">시안 다시 열기</button>'}}if(e.key.toLowerCase()==='f'){e.preventDefault();mode==='slot'?chooseInk():mode==='ink'?preview():null}if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();let delta=e.key==='ArrowLeft'?-1:1;if(mode==='slot')slot=(slot+delta+colors.length)%colors.length;else if(mode==='ink'){let a=available(),i=a.findIndex(x=>x.index===candidate);candidate=a[(i+delta+a.length)%a.length].index}render()}});function fit(){document.querySelector('.screen').style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}onresize=fit;fit();render();
</script></html>
