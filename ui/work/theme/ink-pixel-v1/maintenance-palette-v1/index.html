 document.getElementById('slotCount').textContent=colors.length+'칸';document.querySelector('header aside>span').textContent='보유 골드 '+gold+' G';document.getElementById('escLabel').textContent=task?'작업 선택으로':slot>=0?'칸 선택 해제':'닫기';

 document.getElementById('slots').innerHTML=slotColors[weapon].map((c,i)=>{const d=inks[sets[weapon][i]];return `<button class="slot ${slot===i?'chosen':''}" onclick="setSlot(${i})" aria-label="${colorNames[c]} 칸"><div class="layers"><img src="${A}${d?'filled':'empty'}-${c}.png" alt="">${d?`<img src="${A}${d.id}.png" alt="">`:''}</div><span class="level">+${slotStats[weapon][i].level}</span><span class="name">${d?d.name:'빈 칸'}</span></button>`}).join('');
 const service=document.querySelector('.services');service.hidden=slot<0;
 const level=slot>=0?slotStats[weapon][slot].level:0;
 service.innerHTML=[['ink','잉크 장착·교체','무료'],['upgrade','칸 강화',level>=5?'최대 +5':`+${level} → +${level+1} · ${costs()} G`],['color','칸 색 변경','100 G / 변경권 1장']].map(([id,name,note])=>`<button class="taskOption ${task===id?'selectedTask':''}" onclick="pickTask('${id}')"><span class="taskName">${name}</span><span class="taskMeta">${note}</span></button>`).join('');
 document.getElementById('fLabel').textContent=slot<0?'칸 선택':task?'실행':'작업 선택';
 const detail=document.getElementById('detail');if(slot<0){detail.innerHTML='<p class="label">팔레트 칸을 선택하세요</p>';return;}if(!task){detail.innerHTML='<p class="label">선택한 칸의 작업을 골라주세요</p>';return;}
 const c=slotColors[weapon][slot],current=inks[sets[weapon][slot]],title={ink:'잉크 장착·교체',upgrade:'칸 강화',color:'칸 색 변경'}[task];
 let body=`<p class="label">${weapon?'발사기':'기본검'} · ${colorNames[c]} 칸 · +${level}</p><h2>${title}</h2>`;let disabled=false,action='',note='';
 if(task==='upgrade'){
 const max=level>=5;disabled=max||gold<costs();const value=n=>current?.id==='ink3_red_01'?Math.round(20*(1+.15*n))+'%':'+'+n;
 body+=`<div class="upgradeCompare"><div><p>현재</p><strong>${value(level)}</strong></div>${max?'':`<span>→</span><div><p>강화 후</p><strong class="next">${value(level+1)}</strong></div>`}</div><p class="upgradeNote">${current?.id==='ink3_red_01'?'덧칠 · 추가타 피해':current?'해당 잉크의 효과 수치는 별도 검토':'빈 칸 강화'}</p><p class="upgradeNote">잉크 교체·색 변경 후에도 강화 유지</p>`;
 note=max?'최대 강화입니다.':gold<costs()?`골드 ${costs()-gold} G 부족`:`비용 ${costs()} G`;action='강화하기';
 }else if(task==='color'){
 const full=new URLSearchParams(location.search).get('case')==='full';
 body+=`<p class="sectionLabel">변경 방식</p><h2 style="color:#eee9df">무작위 색 · 빈 칸</h2><p class="effect">변경 후 잉크를 새로 장착하세요.</p><div class="recolorDescription"><h3>${current?'가방으로 반환 · '+current.name:'반환할 잉크 없음'}</h3><p>강화 +${level} 유지${current?' · 가방 '+(full?'5 / 5':'3 / 5'):''}</p></div><p class="paymentLabel">결제 방법 선택</p><div class="payment"><button class="paymentOption ${payment==='gold'?'isSelected':''}" onclick="payment='gold';message='';render()"><span class="paymentTitle">100 G</span><small>유료 ${paidLeft}회 남음</small></button><button class="paymentOption ${payment==='ticket'?'isSelected':''}" onclick="payment='ticket';message='';render()"><span class="paymentTitle">변경권 1장</span><small>보유 ${tickets}장 · 유료 횟수 유지</small></button></div>`;
 disabled=Boolean(current&&full)||(payment==='gold'?(gold<100||paidLeft<1):tickets<1);
 note=disabled?'':current?'기존 잉크는 가방으로 반환':'빈 칸 색 변경 가능 여부 검토 중';
 if(!current)disabled=true;
 action=current&&full?'가방이 가득 찼습니다':disabled?'변경 불가':'무작위 색 변경';
 }else{
 const list=available(),d=inks[candidate];body+=`<p class="sectionLabel">현재 · ${current?current.name:'빈 칸'}</p><p class="effect">${current?current.desc:''}</p><div class="transition"><img src="${A}transition-down.png" alt=""></div><p class="label">보유 잉크</p><div class="candidateRow">${list.map(x=>`<button class="${candidate===x.index?'mark':''}" onclick="candidate=${x.index};render()"><img src="${A}${x.id}-jar.png" alt="${x.name}"></button>`).join('')}</div>${d?`<h2 class="candidateTitle">${d.name}</h2><p class="effect">${d.desc}</p>`:'<p class="effect">보유한 잉크 없음</p>'}`;disabled=!d;note=current?'현재 잉크는 가방으로 반환':'빈 칸에 장착';action=current?'교체 · 무료':'장착 · 무료';
 }
 detail.innerHTML=body+`<div class="taskDecision"><p class="decisionNote" role="status">${message||note}</p><button onclick="executeTask()" ${disabled?'disabled':''}><kbd>F</kbd>${action}</button></div>`;
}
function executeTask(){if(slot<0||!task)return;const st=slotStats[weapon][slot];if(task==='upgrade'){if(st.level>=5||gold<costs())return;gold-=costs();purchases++;st.level++;message='강화 완료 · +'+st.level;}
else if(task==='color'){const full=new URLSearchParams(location.search).get('case')==='full';const valid=payment==='gold'?gold>=100&&paidLeft>0:tickets>0;if(full||!valid||sets[weapon][slot]==null)return;message='미리보기 · 잉크 반환 후 무작위 색의 빈 칸으로 변경 / 실제 변경 없음';}
else{if(candidate<0)return;message='장착 결과 미리보기 · 실제 아이템 변경 없음';}render();}
document.addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key;if(!['Tab','Escape','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','f','F'].includes(k))return;e.preventDefault();if(k==='Tab')setWeapon(1-weapon);else if(k==='Escape'){if(task){task=null;render()}else if(slot>=0){slot=-1;render()}else{document.querySelector('main').hidden=true;}}else if(k.toLowerCase()==='f'){if(slot<0)setSlot(0);else if(!task)pickTask('ink');else executeTask();}else if(k==='ArrowDown'||k==='ArrowUp'){if(slot>=0){const ts=['ink','upgrade','color'];pickTask(ts[(ts.indexOf(task)+(k==='ArrowDown'?1:2)+3)%3]);}}else if(!task)setSlot(slot<0?0:(slot+(k==='ArrowLeft'?colors.length-1:1))%colors.length);else if(task==='color'){payment=payment==='gold'?'ticket':'gold';render();}else if(task==='ink'){const a=available();if(a.length){candidate=a[(a.findIndex(x=>x.index===candidate)+(k==='ArrowLeft'?a.length-1:1))%a.length].index;render();}}});
function fit(){document.querySelector('.screen').style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}onresize=fit;
const q=new URLSearchParams(location.search),view=q.get('task');if(q.get('payment')==='ticket')payment='ticket';if(view){slot=q.get('case')==='empty'?1:0;task=view;candidate=available()[0]?.index??-1;colorInk=colorCandidates()[0]?.index??-1;}else if(q.get('state')==='ink'){task='ink';candidate=1;}fit();render();
</script></html>
