function colorView(){mode='color';document.body.dataset.mode=mode;document.getElementById('escLabel').textContent='팔레트로';document.getElementById('fLabel').textContent=finished?'돌아가기':'색 변경';document.querySelector('header aside>span').textContent='보유 골드 '+demoGold+' G';
const blocked=pay==='gold'?(paidLeft===0?'이번 런의 유료 변경을 모두 사용했습니다.':demoGold<100?'골드 '+(100-demoGold)+' G 부족':''):tickets===0?'보유한 변경권이 없습니다.':'';
document.getElementById('detail').innerHTML=finished?`<p class="label">${targetWeapon} · 선택한 칸</p><h2>색 변경 완료</h2><div class="colorOptions"><img src="${A}empty-${fromColor}.png" width="140"><span class="serviceArrow">→</span><img src="${A}empty-${selectedColor}.png" width="140"></div><p class="colorResult">${colorNames[selectedColor]} 칸 · +${keepLevel} 유지</p><p class="colorNotice">${equippedName?equippedName+"은 가방으로 돌아갔습니다.":"빈 칸의 색이 변경되었습니다."}</p><p class="colorNotice">${pay==='gold'?'100 G 사용 · 유료 변경 '+paidLeft+'회 남음':'변경권 1장 사용 · '+tickets+'장 남음'}</p><button class="colorAction" onclick="location.href='index.html'">팔레트로 돌아가기</button><p class="upgradeCaption">결과 예시 · 실제 아이템은 변경하지 않음</p>`:`<p class="label">${targetWeapon} · ${colorNames[fromColor]} 칸 · +${keepLevel}</p><h2>칸 색 변경</h2><p class="label" style="margin-top:24px">변경할 색</p><div class="colorOptions">${colorChoices.map(c=>`<button class="${selectedColor===c?'mark':''}" onclick="selectedColor='${c}';colorView()"><img src="${A}empty-${c}.png" alt="">${colorNames[c]}</button>`).join('')}</div><p class="label" style="margin-top:36px">사용할 재화</p><div class="payment"><button class="${pay==='gold'?'mark':''}" onclick="pay='gold';colorView()">골드 100 G<small>유료 변경 ${paidLeft}회 남음</small></button><button class="${pay==='ticket'?'mark':''}" onclick="pay='ticket';colorView()">변경권 1장<small>보유 ${tickets}장 · 유료 횟수 유지</small></button></div><p class="colorNotice">${equippedName?"장착된 "+equippedName+"은 가방으로 돌아갑니다.":"빈 칸의 색을 변경합니다."}<br>이 칸의 강화 단계 +${keepLevel}은 유지됩니다.</p>${blocked?`<p class="upgradeStatus">${blocked}</p>`:''}<button class="colorAction" onclick="applyColor()" ${blocked?'disabled':''}><kbd>F</kbd>${colorNames[selectedColor]} 칸으로 변경</button><p class="upgradeCaption">직접 색 선택 검토안 · 100 G는 시험값</p>`;
}
function applyColor(){if(finished){location.href='index.html';return;}if(pay==='gold'){if(paidLeft===0||demoGold<100)return;demoGold-=100;paidLeft--;}else{if(tickets===0)return;tickets--;}finished=true;colorView();}
// This separate state preview fixes the target to the first red slot.
document.getElementById('weapons').style.pointerEvents='none';document.getElementById('slots').style.pointerEvents='none';document.querySelector('.services').style.visibility='hidden';
document.addEventListener('keydown',e=>{if(['Tab','ArrowLeft','ArrowRight','Escape','f','F'].includes(e.key)){e.preventDefault();e.stopImmediatePropagation();if(e.repeat)return;if(e.key==='Escape')location.href='index.html';else if(e.key.toLowerCase()==='f')applyColor();else if(e.key==='Tab'){pay=pay==='gold'?'ticket':'gold';colorView();}else if(!finished){const opts=colorChoices;selectedColor=opts[(opts.indexOf(selectedColor)+(e.key==='ArrowLeft'?3:1))%4];colorView();}}},true);
document.querySelector('.foot').innerHTML='<span><kbd>← →</kbd>색 선택</span><span><kbd>Tab</kbd>재화 선택</span><span><kbd>F</kbd><span id="fLabel">색 변경</span></span><span class="note">색 변경 시안 · 가방 여유 있음</span>';
colorView();if(colorState==='done')applyColor();
</script></html>
