<!doctype html><meta charset="utf-8"><title>팔레트 문양 교체 검토</title><style>body{background:#22232b;color:#eee;font:20px sans-serif;padding:40px}button,select{font:inherit;margin:8px;padding:8px}.slot{position:relative;width:220px;height:155px;margin:35px}.slot img{position:absolute;inset:0;width:220px;height:155px}p{max-width:800px;line-height:1.6}</style><h1>슬롯 유지 · 효과 문양만 교체</h1><p>검토용 문양 조합입니다. 실제 게임의 색상별 효과 허용 규칙을 뜻하지 않습니다.</p><select id="color"></select><select id="symbol"></select><button id="toggle">색상 / 무색 바탕</button><div class="slot"><img id="base"><img id="mark"></div><p>두 이미지는 같은 220×155 영역에 겹칩니다. 문양별 위치를 따로 지정하지 않습니다.</p><script>const colors=['red','yellow','green','blue','purple'],names=['빨강','노랑','초록','파랑','보라'];let neutral=false;colors.forEach((c,i)=>{color.add(new Option(names[i],c));symbol.add(new Option(['베기','장화','사과','조준','연결'][i],c))});function render(){base.src='runtime/slots/'+(neutral?'neutral-filled-':'filled-')+color.value+'.png';mark.src='runtime/symbols/reference-'+symbol.value+'.png'}color.onchange=symbol.onchange=render;toggle.onclick=()=>{neutral=!neutral;render()};render();</script>
