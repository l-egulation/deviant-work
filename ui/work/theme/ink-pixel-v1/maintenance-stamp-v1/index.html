<!doctype html><html lang="ko"><meta charset="utf-8"><title>Deviant · 정비소 스탬프</title><style>
@font-face{font-family:Kkuk;src:url(../assembly-v1/fonts/MemomentKkukkukk.ttf)}*{box-sizing:border-box}body{margin:0;background:#24262b;color:#eee9df;font-family:Kkuk,sans-serif}button,a{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:none;cursor:pointer}button{text-align:left}button:focus-visible,a:focus-visible{outline:2px solid #aacbd8;outline-offset:8px}button:disabled{cursor:default;color:#868e97}.screen{width:1920px;height:1080px;transform-origin:0 0;position:relative;overflow:hidden}.world{position:absolute;inset:0;background:linear-gradient(#24262bf0,#24262bea),url(../screen-set-v6/assets/village.jpg) center/cover;filter:blur(1px)}main{position:relative;margin:0 150px;padding-top:85px}header{display:flex;align-items:center;height:72px}h1{font-size:43px;font-weight:normal;margin:0}header aside{margin-left:auto;font-size:25px}kbd{font:inherit;font-size:22px;border:1px solid #999da3;border-radius:5px;padding:4px 10px;margin-right:12px}nav{display:flex;gap:76px;align-items:center;margin-top:44px;font-size:29px;color:#a8afb6}.selected{color:#eee9df}.wash{position:relative;isolation:isolate;display:inline-block}.wash:before{content:'';position:absolute;inset:-12px -18px;background:url(../maintenance-palette-v1/assets/selection-wash-v1.png) center/contain no-repeat;opacity:.44;z-index:-1;pointer-events:none}nav .selected{transform:scale(1.2)}.cols{display:grid;grid-template-columns:708px 1fr;gap:144px;margin-top:64px}.weapons{display:flex;gap:72px;align-items:center;height:96px}.weapons button{display:flex;align-items:center;gap:18px;font-size:30px;transform-origin:left center;color:#a8afb6}.weapons button.selected{transform:scale(1.15);color:#eee9df}img{image-rendering:pixelated;object-fit:contain}.weapons img{width:96px;height:96px}.types{margin-top:42px;display:flex;gap:68px;font-size:28px;color:#a8afb6}.types .selected{transform:scale(1.1)}.label{color:#a8afb6;font-size:24px;margin-bottom:20px}.inventory{margin-top:42px}.candidate{display:flex;justify-content:space-between;align-items:center;height:92px;width:100%;font-size:30px;border-bottom:1px solid #a8afb624}.candidate span{transform-origin:left center}.candidate.selected span{transform:scale(1.1)}.candidate small{font-size:23px;color:#a8afb6}.candidate.selected small{color:#aacbd8}.hint{font-size:23px;color:#a8afb6;line-height:1.6;margin-top:28px}.detail .label{margin-bottom:14px}.detail h2{font-size:35px;font-weight:normal;margin:0 0 14px}.detail p{font-size:26px;line-height:1.55;margin:0}.current{color:#bdc2c7}.change{display:flex;align-items:center;gap:20px;margin:27px 0}.change:before,.change:after{content:'';height:1px;background:#a8afb650;flex:1}.change img{width:24px;height:22px}.next h2{color:#b5d8e4}.skill{font-size:24px!important;color:#c3d2d6;margin-top:16px!important}.cost{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #a8afb640;margin-top:30px;padding-top:22px;font-size:28px}.warning{color:#e4b59f!important;font-size:23px!important;margin-top:15px!important}.action{margin-top:26px;font-size:30px;color:#b5d8e4}.notice{margin-top:18px;font-size:23px;color:#b5d8e4}.footer{position:absolute;bottom:48px;left:150px;right:150px;font-size:22px;color:#919aa5;display:flex;justify-content:space-between}
</style><div class="screen"><div class="world"></div><main><header><h1>정비소</h1><aside id="money"></aside></header><nav><a href="../maintenance-set-v1/index.html?view=growth">성장</a><a href="../maintenance-palette-v1/index.html">팔레트</a><span class="selected wash">스탬프</span></nav><div class="cols"><section><div class="weapons" id="weapons"></div><div class="types" id="types"></div><div class="inventory"><div class="label">보유 스탬프</div><div id="list"></div></div><div class="hint">무기 스탬프는 같은 도면에만 적용됩니다.<br>스킬 스탬프는 모든 무기에 적용됩니다.</div></section><section class="detail" id="detail"></section></div></main><footer class="footer"><span>무기 → 스탬프 종류 → 보유 스탬프 선택</span><span>테마 시안 · 실제 아이템 변경 없음</span></footer></div><script>
const q=new URLSearchParams(location.search);let kind=q.get('kind')||'weapon',weapon=0,pick=0,gold=q.get('case')==='poor'?10:120;const empty=q.get('case')==='empty';
const pools={weapon:[{name:'채찍',tag:'검 도면',compatible:true,desc:'긴 사거리의 채찍으로 전방의 적을 공격합니다.',skill:'가시 그물 · 전방의 여러 적을 잠시 속박합니다.',note:'범위 스킬 스탬프 유지'},{name:'레이피어',tag:'현재와 같은 효과',compatible:true,same:true},{name:'방패',tag:'둔기 도면 · 호환 불가',compatible:false}],skill:[{name:'이동',tag:'모든 도면',compatible:true,desc:'흘려찌르기',skill:'가까운 적 앞으로 순간이동한 뒤 찌릅니다. 이동 자체에 무적은 없습니다.',note:'기본 재사용 대기시간 · 6초'},{name:'범위',tag:'현재와 같은 효과',compatible:true,same:true}]};
function chooseKind(k){if(empty&&k==='skill'){location.href='?kind=skill';return}kind=k;pick=0;render()}function render(){money.textContent=`보유 골드 ${gold} G`;weapons.innerHTML=['레이피어','발사기'].map((n,i)=>`<button class="${weapon===i?'selected':''}" onclick="weapon=${i};render()"><img src="../screen-set-v6/assets/weapon-${i?'launcher':empty?'base_sword':'rapier'}.png"><span class="${weapon===i?'wash':''}">${i===0&&empty?'기본검':n}</span></button>`).join('');types.innerHTML=['weapon','skill'].map((k,i)=>`<button class="${kind===k?'selected wash':''}" onclick="chooseKind('${k}')">${i?'스킬':'무기'} 스탬프</button>`).join('');
if(weapon===1){list.innerHTML='<p class="hint">발사기 비교 시안은 준비 중입니다.</p>';detail.innerHTML='<div class="label">발사기</div><h2>장착된 스탬프 없음</h2><p class="hint">이번 시안은 검 도면의 장착·교체 흐름을 검토합니다.</p>';return}
list.innerHTML=pools[kind].map((x,i)=>`<button class="candidate ${pick===i?'selected':''}" onclick="pick=${i};render()"><span class="${pick===i?'wash':''}">${x.name}</span><small>${x.tag}</small></button>`).join('');const x=pools[kind][pick],price=empty?0:20,blocked=!x.compatible||(!empty&&x.same)||gold<price;const current=empty?'—':kind==='weapon'?'레이피어':'범위 · 장침';
detail.innerHTML=`<div class="current"><div class="label">현재 장착</div><h2>${current}</h2><p>${empty?'장착된 스탬프가 없습니다.':kind==='weapon'?'좁은 전방을 빠르게 찌르는 검입니다.':'전방으로 긴 찌르기를 펼쳐 경로의 적을 공격합니다.'}</p></div><div class="change"><img src="../screen-set-v6/assets/transition-down.png" alt="변경 후"></div><div class="next"><div class="label">${empty?'장착 후':'교체 후'}</div><h2>${kind==='skill'&&x.desc?x.desc:x.name}</h2><p>${!x.compatible?'검 도면에는 이 스탬프를 적용할 수 없습니다.':x.same?'현재 장착과 같은 효과입니다.':kind==='weapon'?x.desc:x.skill}</p>${x.same||!x.compatible?'':`<p class="skill">${kind==='weapon'?empty?'기본 특수 · 휘감기':x.skill:x.note}</p>${kind==='weapon'&&!empty?`<p class="hint">${x.note}</p>`:''}`}</div><div class="cost"><span>${empty?'첫 장착':'교체 비용'}</span><strong>${empty?'무료':price+' G'}</strong></div><p class="warning">${empty?'선택한 스탬프가 사용됩니다.':`기존 ${kind==='weapon'?'레이피어':'범위'} 스탬프는 소멸합니다.`}</p><button class="action" ${blocked?'disabled':''} onclick="confirmPreview()"><kbd>F</kbd>${!x.compatible?'호환되지 않는 도면':!empty&&x.same?'같은 효과 · 적용 불가':gold<price?'골드 부족':empty?'장착':'교체'}</button><div id="notice" class="notice" role="status"></div>`}
function confirmPreview(){notice.textContent='적용 결과 확인용 시안입니다. 아이템과 재화는 변경되지 않습니다.'}document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'){const b=document.querySelector('.action');if(b&&!b.disabled)b.click()}});function fit(){document.querySelector('.screen').style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}onresize=fit;fit();render();
</script></html>
