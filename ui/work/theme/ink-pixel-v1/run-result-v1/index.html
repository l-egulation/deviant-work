<!doctype html><html lang="ko"><meta charset="utf-8"><title>Deviant · 도전 결과</title><style>
@font-face{font-family:Kkuk;src:url(../assembly-v1/fonts/MemomentKkukkukk.ttf)}*{box-sizing:border-box}body{margin:0;background:#24262b;color:#eee9df;font-family:Kkuk,sans-serif}.screen{width:1920px;height:1080px;position:relative;transform-origin:top left;overflow:hidden}.world{position:absolute;inset:0;background:linear-gradient(#24262bf0,#24262bea),url(../screen-set-v6/assets/village.jpg) center/cover;filter:blur(2px)}main{position:absolute;width:820px;left:550px;top:165px}h1{font-size:49px;font-weight:normal;margin:0 0 15px}.subtitle{font-size:25px;color:#b3bbc4;margin:0 0 42px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:26px 95px;padding:28px 0;border-top:1px solid #a8afb640;border-bottom:1px solid #a8afb640}.stat{display:flex;align-items:baseline;justify-content:space-between;font-size:29px}.stat span{color:#b3bbc4;font-size:25px}.stat strong{font-weight:normal}.wide{grid-column:1/-1}.boss{margin-top:30px}.boss .stat{margin-bottom:16px}.boss strong{color:#e3b59f}.bar{height:9px;background:#b3bbc420;width:100%}.bar i{display:block;background:#bd8175;width:18%;height:100%}.reward{margin-top:34px;display:flex;justify-content:space-between;align-items:center}.reward span{font-size:28px}.reward strong{font-size:40px;color:#e0cc83;font-weight:normal}.note{font-size:23px;color:#b3bbc4;margin:12px 0 0}.village{margin-top:25px;padding-top:25px;border-top:1px solid #a8afb640;display:flex;justify-content:space-between;align-items:center;font-size:29px}.village strong{font-weight:normal;color:#bdd9aa}.actions{border-top:1px solid #a8afb640;margin-top:38px;padding-top:29px;display:flex;justify-content:space-between;align-items:center}button{background:none;border:0;padding:0;color:#eee9df;font:inherit;font-size:32px;cursor:pointer;position:relative;isolation:isolate}button:before{content:'';position:absolute;inset:-8px -18px;background:url(../maintenance-palette-v1/assets/selection-wash-v1.png) center/100% 100% no-repeat;opacity:.5;z-index:-1}button:focus-visible{outline:1px solid #b5d8e4;outline-offset:14px}.keys{font-size:23px;color:#b3bbc4}kbd{font:inherit;border:1px solid #999da3;border-radius:5px;padding:4px 10px;margin-right:12px}.clear h1{color:#eee9df}@media(prefers-reduced-motion:no-preference){button:hover{transform:scale(1.05)}}
</style><div class="screen"><div class="world"></div><main id="result"></main></div><script>
const kind=new URLSearchParams(location.search).get('kind')||'death',clear=kind==='clear',boss=kind==='boss';const sample=clear?{time:'18:42',kills:86,rooms:'12 / 12',pigment:156}:boss?{time:'16:08',kills:72,rooms:'12 / 12',pigment:102}:{time:'07:36',kills:28,rooms:'5 / 12',pigment:38};
result.className=clear?'clear':'';result.innerHTML=`<h1>${clear?'1챕터 클리어':'여정 종료'}</h1><p class="subtitle">${clear?'이번 도전의 기록':boss?'1챕터 · 보스전에서 사망':'1챕터 · 탐험 중 사망'}</p><section class="stats"><div class="stat"><span>플레이 시간</span><strong>${sample.time}</strong></div><div class="stat"><span>처치 수</span><strong>${sample.kills}</strong></div><div class="stat wide"><span>탐험한 구역</span><strong>${sample.rooms}</strong></div></section>${boss?'<section class="boss"><div class="stat"><span>보스 남은 체력</span><strong>18%</strong></div><div class="bar" aria-label="보스 남은 체력 18%"><i></i></div></section>':''}<section class="reward"><span>이번 런 획득 마법안료</span><strong>+${sample.pigment}</strong></section><p class="note">${clear?'마을에서 영구 해금에 사용할 수 있습니다.':'사망해도 획득한 마법안료는 유지됩니다.'}</p>${clear?'<section class="village"><span>마을 잉크 획득</span><strong>1 / 5</strong></section>':''}<div class="actions"><button id="return">마을로</button></div>`;
function back(){result.hidden=true;document.querySelector('.world').style.backgroundImage="url('../screen-set-v6/assets/village.jpg')";document.querySelector('.world').style.filter='none'}document.getElementById('return').onclick=back;document.addEventListener('keydown',e=>{if(!result.hidden&&!e.repeat&&['f','F','Enter'].includes(e.key)){e.preventDefault();back()}});function fit(){document.querySelector('.screen').style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}onresize=fit;fit();
</script></html>
