<!doctype html><html lang="ko"><meta charset="utf-8"><title>Deviant · 잉크 판매대</title><style>
@font-face{font-family:Kkuk;src:url(../assembly-v1/fonts/MemomentKkukkukk.ttf)}*{box-sizing:border-box}body{margin:0;background:#24262b;color:var(--paper);font-family:Kkuk,sans-serif}button,a{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:none;cursor:pointer}button{text-align:left}button:focus-visible,a:focus-visible{outline:2px solid #aacbd8;outline-offset:8px}button:disabled{cursor:default;color:var(--muted)}.screen{width:1920px;height:1080px;transform-origin:0 0;position:relative;overflow:hidden}.world{position:absolute;inset:0;background:linear-gradient(#24262bf0,#24262bea),url(../screen-set-v6/assets/village.jpg) center/cover;filter:blur(1px)}main{position:relative;margin:0 150px;padding-top:85px}header{display:flex;align-items:center;height:72px}h1{font-size:43px;font-weight:normal;margin:0}header aside{margin-left:auto;font-size:25px;display:flex;gap:36px}kbd{font:inherit;font-size:22px;border:1px solid #999da3;border-radius:5px;padding:4px 10px;margin-right:12px}nav{display:flex;gap:76px;margin-top:44px;font-size:29px;color:var(--muted)}.wash{position:relative;isolation:isolate;display:inline-block}.wash:before{content:'';position:absolute;inset:-12px -18px;background:url(../maintenance-palette-v1/assets/selection-wash-v1.png) center/contain no-repeat;opacity:.44;z-index:-1;pointer-events:none}nav .wash{color:var(--paper);transform:scale(1.2)}.cols{display:grid;grid-template-columns:708px 1fr;gap:144px;margin-top:70px}.label{font-size:24px;color:var(--muted);margin-bottom:22px}.stock{display:flex;flex-direction:column;gap:20px}.product{width:100%;display:flex;align-items:center;gap:28px;height:136px;border-bottom:1px solid #a8afb62b}.product img{width:100px;height:116px;object-fit:contain;image-rendering:pixelated;transform:scale(.9)}.product.active img{transform:scale(1.05)}.product .name{font-size:31px;display:block;transform-origin:left center}.product.active .name{transform:scale(1.1)}.product small{display:block;font-size:23px;color:var(--muted);margin-top:15px}.price{margin-left:auto;font-size:28px}.product.active .price{color:var(--muted);transform:scale(1.1);transform-origin:right}.product.sold{opacity:.38}.hint{font-size:23px;color:var(--muted);line-height:1.6;margin-top:28px}.hero{display:flex;gap:30px;align-items:center;min-height:170px}.hero img{width:132px;height:150px;object-fit:contain;image-rendering:pixelated}.hero h2{font-size:38px;color:var(--ink);font-weight:normal;margin:0 0 18px}.hero p{font-size:24px;color:var(--muted);margin:0}.description{font-size:28px;line-height:1.7;min-height:140px;margin:28px 0 30px}.checkout{border-top:1px solid #a8afb650;padding-top:26px}.line{display:flex;justify-content:space-between;align-items:center;font-size:28px;margin-bottom:23px}.line span:first-child{color:var(--muted);font-size:25px}.preview{font-size:23px;color:var(--muted)}.action{font-size:31px;color:var(--muted);margin-top:28px}.message{margin-top:24px;padding-top:22px;border-top:1px solid #a8afb640;font-size:26px;color:var(--muted)}.error{color:#e3b59f}.footer{position:absolute;bottom:52px;left:150px;right:150px;font-size:22px;color:var(--muted);display:flex;justify-content:space-between}
#money{font-size:33px;color:#e0cc83}.action:disabled{color:#e3b59f}
</style><link rel="stylesheet" href="../review-common.css"><div class="screen"><div class="world"></div><main><header><h1>정비소</h1><aside><span id="money"></span><span id="capacity"></span></aside></header><nav><a href="../maintenance-growth-v2/index.html">성장</a><a href="../maintenance-palette-v1/index.html">팔레트</a><a href="../maintenance-stamp-v1/index.html">스탬프</a><span class="wash">잉크 판매대</span></nav><div class="cols"><section><div class="label">판매 중인 잉크</div><div id="stock" class="stock"></div></section><section id="detail"></section></div></main><footer class="footer"><span><kbd>↑ ↓</kbd>잉크 선택　 <kbd>F</kbd>구매</span><span>테마 시안 · 실제 게임 데이터 변경 없음</span></footer></div><script>
const q=new URLSearchParams(location.search),mode=q.get('case');let gold=mode==='poor'?300:850,used=mode==='full'?5:3,selected=0;const cap=5;let receipt='';const items=[{id:'ink3_red_02',name:'집중 공격',grade:3,price:420,color:'#e5a6a7',desc:'같은 몬스터를 연달아 때릴 때마다 그 몬스터에게 주는 피해가 4%씩 오릅니다. 최대 5중첩(20%)입니다.'},{id:'ink3_red_04',name:'터지는 잉크',grade:4,price:600,color:'#e5a6a7',desc:'표식을 터트린 몬스터에게 기준 피해 60%인 추가타 1회를 가합니다.'},{id:'ink3_yellow_01',name:'전기 발자국',grade:3,price:420,color:'#e0cc83',desc:'이동할 때마다 발밑에 작은 전기장을 남깁니다. 전기장 안의 적에게 지속 피해를 줍니다.'}];
function render(){money.textContent=`보유 골드 ${gold} G`;capacity.textContent=`가방 ${used} / ${cap}`;stock.innerHTML=items.map((x,i)=>`<button class="product ${selected===i?'active':''} ${x.sold?'sold':''}" ${x.sold?'disabled':''} onclick="selected=${i};receipt='';render()"><img src="../screen-set-v6/assets/${x.id}-jar.png" alt=""><span><span class="name ${selected===i&&!x.sold?'wash':''}">${x.name}</span><small>${x.grade}등급</small></span><span class="price">${x.sold?'판매 완료':x.price+' G'}</span></button>`).join('');const x=items[selected],blocked=x.sold||used>=cap||gold<x.price;document.documentElement.style.setProperty('--ink',x.color);detail.innerHTML=`<div class="label">${x.sold?'구매한 잉크':'선택한 잉크'}</div><div class="hero"><img src="../screen-set-v6/assets/${x.id}-jar.png" alt="${x.name}"><div><h2>${x.name}</h2><p>색상 잉크 · ${x.grade}등급</p></div></div><p class="description">${x.desc}</p><div class="checkout"><div class="preview">가방 ${used} / ${cap}</div><div class="actionRow">${!x.sold?`<button class="action" ${blocked?'disabled':''} onclick="buy()">${used>=cap?'가방이 가득 찼습니다':gold<x.price?'골드 부족':'구매'}</button><span class="actionCost">${x.price} G</span>`:''}<span class="actionHelp">${!blocked?'구매한 잉크는 가방에 보관':''}</span></div></div>${receipt?`<div class="message" role="status">${receipt}</div>`:''}`}
function buy(){const x=items[selected];if(x.sold||used>=cap||gold<x.price)return;gold-=x.price;used++;x.sold=true;receipt='구매 완료 · 가방에 보관했습니다.';render()}
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'){e.preventDefault();if(!e.repeat)buy()}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();let step=e.key==='ArrowDown'?1:-1;for(let n=1;n<=items.length;n++){let i=(selected+step*n+items.length*2)%items.length;if(!items[i].sold){selected=i;receipt='';render();break}}}});function fit(){document.querySelector('.screen').style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}onresize=fit;fit();render();if(mode==='bought')buy();
</script></html>
