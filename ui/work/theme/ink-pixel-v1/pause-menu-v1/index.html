<!doctype html><html lang="ko"><meta charset="utf-8"><title>Deviant · 일시정지</title><style>
@font-face{font-family:Kkuk;src:url(../assembly-v1/fonts/MemomentKkukkukk.ttf)}*{box-sizing:border-box}body{margin:0;background:#24262b;color:#eee9df;font-family:Kkuk,sans-serif}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}button:focus-visible{outline:1px solid #b5d8e4;outline-offset:12px}.screen{width:1920px;height:1080px;position:relative;transform-origin:top left;overflow:hidden}.world{position:absolute;inset:0;background:linear-gradient(#24262bed,#24262be8),url(../screen-set-v6/assets/village.jpg) center/cover;filter:blur(2px)}main{position:relative;padding:100px 180px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:46px;font-weight:normal;margin:0}header span{font-size:25px;color:#b3bbc4}kbd{font:inherit;font-size:23px;display:inline-block;border:1px solid #9ca4ac;border-radius:5px;padding:5px 11px;margin-right:12px;min-width:40px;text-align:center}.menu{margin:175px auto 0;width:700px}.menu h2{font-size:28px;color:#b3bbc4;font-weight:normal;margin:0 0 40px}.choices{display:flex;flex-direction:column;align-items:flex-start;gap:46px}.choice{font-size:37px;position:relative;isolation:isolate;padding:8px 0;transform-origin:left center;transition:transform .12s,color .12s;color:#b3bbc4}.choice.selected{transform:scale(1.12);color:#eee9df}.choice.selected:before{content:'';position:absolute;inset:0 -30px -10px;background:url(../maintenance-palette-v1/assets/selection-wash-v1.png) center/100% 100% no-repeat;opacity:.53;z-index:-1}.foot{position:absolute;left:180px;right:180px;bottom:90px;border-top:1px solid #a8afb640;padding-top:25px;display:flex;gap:40px;font-size:25px;color:#b3bbc4}.guide{display:grid;grid-template-columns:1fr 1fr 1fr;gap:80px;margin-top:120px}.guide section+section{border-left:1px solid #a8afb640;padding-left:50px}.guide h2{font-size:33px;font-weight:normal;margin:0 0 45px}.line{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:32px 0;font-size:27px}.keys{white-space:nowrap}.line kbd{margin-right:5px}.note{font-size:23px;color:#b3bbc4;line-height:1.7;margin-top:36px}.confirm{width:900px;margin:180px auto 0}.confirm h2{font-size:45px;font-weight:normal;margin:0 0 32px}.confirm p{font-size:29px;line-height:1.8;margin:0;color:#b3bbc4}.confirm .choices{flex-direction:row;gap:110px;margin-top:68px;border-top:1px solid #a8afb640;padding-top:36px}.confirm .choice{font-size:32px}.confirm .danger:not(.selected){color:#e3b59f}.demo{margin-top:200px;text-align:center;font-size:35px}.demo small{display:block;font-size:24px;color:#b3bbc4;margin-top:25px}@media(prefers-reduced-motion:reduce){.choice{transition:none}}
</style><div class="screen"><div class="world"></div><main id="main"></main><footer class="foot" id="foot"></footer></div><script>
const params=new URLSearchParams(location.search);let context=params.get('context')==='village'?'village':'combat',view=params.get('view')||'pause',selected=0;
const main=document.querySelector('#main'),foot=document.querySelector('#foot');
function key(s){return '<kbd>'+s+'</kbd>'}function choice(label,action,extra=''){return `<button class="choice ${extra}" data-action="${action}">${label}</button>`}
function render(){main.innerHTML='<header><h1>'+({pause:'일시정지',help:'조작 안내',confirm:'마을로 돌아가기',title:'타이틀로 돌아가기',restart:'다시 시작'}[view]||'일시정지')+'</h1><span>'+key('Esc')+' '+(view==='pause'?'계속하기':'뒤로')+'</span></header>';foot.innerHTML=key('↑ ↓')+'이동　 '+key('F')+'선택';
if(view==='pause'){main.innerHTML+=`<section class="menu"><div class="choices">${choice('계속하기','resume')}${choice('설정','settings')}${choice('조작 안내','help')}${context==='village'?choice('게임 초기화','resetProgress'):''}${choice(context==='village'?'타이틀로':'마을로 돌아가기',context==='village'?'title':'confirm')}</div></section>`}
if(view==='help'){const row=(name,keys)=>`<div class="line"><span>${name}</span><span class="keys">${keys.map(key).join('')}</span></div>`;main.innerHTML+=`<div class="guide"><section><h2>이동</h2>${row('이동',['←','→'])}${row('점프 · 2단 점프',['Space'])}${row('대시',['Shift'])}${row('발판 내려가기',['↓','Space'])}</section><section><h2>전투</h2>${row('무기 1 · 기본 공격',['Q'])}${row('무기 1 · 스킬',['E'])}${row('무기 2 · 기본 공격',['W'])}${row('무기 2 · 스킬',['R'])}</section><section><h2>탐험</h2>${row('상호작용',['F'])}${row('가방 · 장비',['I'])}${row('전체 지도',['M'])}${row('포탈 설치',['C','V'])}<p class="note">포탈 앞에서 F로 이동</p></section></div>`;foot.innerHTML=key('Esc')+'일시정지로 돌아가기';}
if(view==='confirm'||view==='title'){let village=view==='confirm';main.innerHTML+=`<section class="confirm confirmationPanel"><h2>${village?'이번 도전을 마칠까요?':'타이틀로 돌아갈까요?'}</h2><p>${village?'현재 도전의 진행 상황과<br>이번 런에서 획득한 영구 재화를 포기합니다.':'현재 마을을 나가 타이틀 화면으로 이동합니다.'}</p><div class="choices">${choice('취소','pause')}${choice(village?'포기하고 마을로':'타이틀로','leave','danger')}</div></section>`;foot.innerHTML=key('← →')+'이동　 '+key('F')+'선택　 '+key('Esc')+'취소';}
if(view==='restart'){main.innerHTML+=`<section class="confirm confirmationPanel"><h2>출발 구성을 다시 만들까요?</h2><p>모든 도면의 팔레트 색을 새로 뽑습니다.<br>도면 선택과 다시 뽑기 횟수가 초기화됩니다.</p><p style="margin-top:20px;color:#eee9df">영구 해금과 보유 재화는 유지됩니다.</p><div class="choices">${choice('취소','pause')}${choice('다시 시작','restartNow','danger')}</div></section>`;foot.innerHTML=key('← →')+'이동　 '+key('F')+'선택　 '+key('Esc')+'취소';}
if(view==='resume'||view==='leave'){main.innerHTML='<div class="demo">'+(view==='resume'?'게임 화면으로 복귀':'화면 전환 확인')+'<small>디자인 검토용 · 실제 게임에는 연결되지 않았습니다.</small><button class="choice" data-action="pause">일시정지 시안 다시 보기</button></div>';foot.innerHTML='';}
selected=0;document.querySelectorAll('.choice').forEach((b,i)=>{b.onmouseenter=()=>select(i);b.onfocus=()=>select(i);b.onclick=()=>{if(b.dataset.action==='resetProgress'){location.href='../sketch-v3/index.html?state=reset-confirm&from=village-pause';return}if(b.dataset.action==='settings'){location.href='../settings-v1/index.html?from=pause&context='+context;return}if(b.dataset.action==='restartNow'){location.href='../departure-v1/index.html?restart=1&'+(params.get('slots')==='5'?'slots=5':'')+(params.get('reroll')==='1'?'&reroll=1':'');return}view=b.dataset.action;render()}});select(view==='pause'&&params.get('focus')==='settings'?1:0)}
function select(i){let buttons=[...document.querySelectorAll('.choice')];selected=(i+buttons.length)%buttons.length;buttons.forEach((b,n)=>{b.classList.toggle('selected',n===selected);b.setAttribute('aria-current',n===selected?'true':'false')})}
document.addEventListener('keydown',e=>{if(e.repeat)return;if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();select(selected+(['ArrowDown','ArrowRight'].includes(e.key)?1:-1))}if((e.code?.startsWith('Key')?e.code.slice(3).toLowerCase():e.key.toLowerCase())==='f'||e.key==='Enter')document.querySelectorAll('.choice')[selected]?.click();if(e.key==='Escape'){view=view==='pause'?'resume':'pause';render()}});function fit(){document.querySelector('.screen').style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}onresize=fit;render();fit();
</script></html>
