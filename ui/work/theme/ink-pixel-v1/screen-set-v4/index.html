<!doctype html><html lang="ko"><meta charset="utf-8"><title>Deviant · 가방과 장비</title><style>
@font-face{font-family:Kkuk;src:url(../assembly-v1/fonts/MemomentKkukkukk.ttf)}*{box-sizing:border-box}body{margin:0;background:#202228;color:#e9e6de;font-family:Kkuk,'Apple SD Gothic Neo',sans-serif}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}button:focus-visible{outline:2px solid #79a5b8;outline-offset:5px}.screen{width:1920px;height:1080px;transform-origin:top left;position:relative;overflow:hidden}.world{position:absolute;inset:0;background:linear-gradient(#24262bf0,#24262be8),url(assets/village.jpg) center/cover;filter:blur(1px)}main{position:relative;margin:0 150px;padding-top:85px}header{display:flex;align-items:center;gap:50px;height:70px}header button{font-size:43px;color:#92969b}header .active{color:#f3eee5}header aside{margin-left:auto;font-size:23px;color:#bbbfc2}.swash{position:relative;z-index:0}.swash:after{content:'';position:absolute;left:-4px;right:-7px;height:10px;bottom:-6px;z-index:-1}.columns{display:grid;grid-template-columns:810px 1fr;gap:95px;margin-top:63px}.tabs{display:flex;gap:32px;font-size:24px;color:#969ca4;height:55px}.tabs .active{color:#eee9df}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 28px;margin-top:32px;width:740px}.item{position:relative;height:150px;display:flex;align-items:center;justify-content:center}.item img{height:123px;width:auto;image-rendering:pixelated}.item.selected:after{content:'';position:absolute;width:108px;height:10px;bottom:0;clip-path:none}.muted{color:#9da4ae}.label{font-size:24px;color:#a8afb6;letter-spacing:1px;margin:0 0 22px}.title{font-size:40px;margin:0 0 20px;color:var(--ink,#e8d5c5)}p{font-size:27px;line-height:1.65;margin:10px 0}.small{font-size:24px}.detailHero{height:200px;display:flex;align-items:center;gap:35px}.detailHero img{height:170px;image-rendering:pixelated}.rule{height:1px;background:#a3a6a842;margin:30px 0}.detail{max-width:680px}.footer{position:absolute;bottom:74px;left:150px;right:150px;display:flex;align-items:center;gap:34px;font-size:24px}.footer .muted{margin-left:auto;font-size:20px}kbd{font-family:inherit;font-size:22px;border:1px solid #999da3;border-radius:5px;padding:4px 10px;margin-right:10px}.weapons{display:flex;gap:48px;align-items:center;height:95px}.weapons button{display:flex;align-items:center;gap:18px;font-size:32px}.weapons img{width:82px;height:75px;object-fit:contain;image-rendering:pixelated;mix-blend-mode:lighten}.stamps{display:flex;gap:50px;margin:46px 0;font-size:24px}.stamps button{color:#afb4bb}.stamps strong{font-family:sans-serif;display:block;color:#e7e2d9;font-size:28px;margin-top:15px}.slots{display:flex;gap:7px;margin-top:25px}.slot{width:144px;text-align:center}.layers{position:relative;width:144px;height:102px}.layers img{position:absolute;inset:0;width:144px;height:102px;image-rendering:pixelated}.slot span{display:block;margin-top:10px;font-size:25px}.slotname{display:block;font-size:27px;line-height:1.3;margin-top:15px;font-weight:normal;word-break:keep-all;min-height:70px}.slot.focus span{color:#9ac7d7}.slot.focus .layers:after{content:'';position:absolute;left:35px;right:35px;bottom:-6px;height:6px;background:none}.loadout{margin-top:28px;display:flex;gap:22px;font-size:20px;color:#b9c1c8;flex-wrap:wrap;max-width:730px}.current{min-height:185px}.current h2{font-size:32px;margin:0 0 15px}.candidateRow{display:flex;align-items:center;gap:24px;margin:26px 0 18px;height:110px}.candidateRow .item{height:110px;width:106px}.candidateRow .item img{height:89px}.candidateRow .item.selected:after{width:82px;height:7px}.arrow{font-family:sans-serif;font-size:32px;color:#b8c8cf}.arrow:disabled{opacity:.2}.candidateDetail h2{font-size:32px;margin:22px 0 12px;color:var(--ink)}.candidateDetail p{font-size:25px;line-height:1.55}.hint{margin-top:22px;font-size:23px;color:#98a1ac}.bagcount{margin-top:29px;font-size:21px;color:#99a1aa}button:hover{color:#fff}.empty{height:450px;display:grid;place-items:center;color:#a2a9b0;font-size:27px}

.swash:after{background:url(assets/selection-swash.png) center/100% 100% no-repeat;clip-path:none;height:13px;bottom:-9px}
.item.selected:after{background:url(assets/selection-swash.png) center/100% 100% no-repeat;clip-path:none;height:12px}
.candidateRow .item.selected:after{height:10px}
.slot.focus .layers:after{background:url(assets/selection-swash.png) center/100% 100% no-repeat;height:8px}

</style><div class="screen"><div class="world"></div><main><header><button id="bag">가방</button><button id="equip">장비</button><aside>일시정지　 |　 <kbd>I / Esc</kbd>닫기</aside></header><div id="content"></div></main><footer class="footer" id="footer"></footer></div><script>
const data=[{"id": "ink3_red_01", "name": "덧칠", "color": "red", "description": "원공격 피해의 20%인 추가타 1회를 가한다."}, {"id": "ink3_red_02", "name": "집중 공격", "color": "red", "description": "같은 몬스터를 연달아 때릴 때마다 그 몬스터에게 주는 피해가 4%씩 오른다. 최대 5중첩(20%)이다."}, {"id": "ink3_red_04", "name": "터지는 잉크", "color": "red", "description": "표식을 터트린 몬스터에게 기준 피해 60%인 추가타 1회를 가한다."}, {"id": "ink3_yellow_01", "name": "전기 발자국", "color": "yellow", "description": "1.5unit 이동할 때마다 발밑에 작은 전기장(반경 0.75)을 2초간 남긴다. 전기장 안의 몬스터는 0.5초마다 기준 피해 15%를 받는다."}, {"id": "ink3_yellow_02", "name": "뛰어난 발걸음", "color": "yellow", "description": "공격 속도와 이동 속도가 각각 10% 증가한다."}, {"id": "ink3_green_04", "name": "전투 식량", "color": "green", "description": "몬스터를 5마리 처치할 때마다 체력 6을 회복한다."}, {"id": "ink3_green_01", "name": "든든한 배리어", "color": "green", "description": "보호막이 남아 있는 동안 공격 피해가 20% 증가한다."}, {"id": "ink3_blue_01", "name": "범위 증폭", "color": "blue", "description": "공격 범위(반경)가 20% 증가한다."}, {"id": "ink3_blue_02", "name": "교대 타격", "color": "blue", "description": "이 잉크를 낀 무기에서 다른 무기로 바꾸면, 바꿔 든 무기 특수 스킬의 남은 쿨타임이 1초 줄어든다. 이 잉크를 낀 무기의 쿨타임은 줄지 않는다."}, {"id": "ink3_purple_01", "name": "먹물 늪", "color": "purple", "description": "몬스터를 0.8초 속박하고, 속박을 걸 때 기준 피해 30%를 준다."}, {"id": "ink3_purple_05", "name": "사약", "color": "purple", "description": "몬스터를 3초간 중독시켜 0.5초마다 기준 피해 8%를 준다. 다시 맞히면 지속시간만 갱신한다."}, {"id": "ink3_purple_07", "name": "쪽빛 족쇄", "color": "purple", "description": "남색 표식이 터질 때 몬스터를 0.6초 속박하고, 속박을 걸 때 기준 피해 20%를 준다."}];let view=new URLSearchParams(location.search).get('view')||'bag',selected=new URLSearchParams(location.search).has('view')&&new URLSearchParams(location.search).get('view')==='equipment'?1:0,slot=Number(new URLSearchParams(location.search).get('slot')||0),page=0,weapon=0,category=0,stamp='';const colors={red:'#e5a6a7',yellow:'#e0cc83',green:'#a9d797',blue:'#97c7e9',purple:'#c7a6df'};let equipped=['ink3_red_01','ink3_yellow_02','ink3_green_04',null,'ink3_blue_01'];const slotColors=['red','yellow','green','blue','neutral'];
function item(d,idx,active){return `<button class="item ${active?'selected':''}" aria-label="${d.name}" onclick="selected=${idx};render()"><img src="assets/${d.id}-jar.png" alt="${d.name}"></button>`}
function render(){bag.className=view==='bag'?'active swash':'';equip.className=view==='equipment'?'active swash':'';let d=data[selected];document.documentElement.style.setProperty('--ink',colors[d.color]);
if(view==='bag'){content.innerHTML=`<div class="columns"><section><nav class="tabs">${['전체 12','색·능력치 12/15','형태 0/15','특수 0/15'].map((x,i)=>`<button class="${i===category?'active swash':''}" onclick="category=${i};render()">${x}</button>`).join('')}</nav>${category<2?`<div class="grid">${data.map((x,i)=>item(x,i,i===selected)).join('')}</div><div class="bagcount">보유 12개　·　카테고리별 보관</div>`:'<div class="empty">보유한 도장이 없습니다</div>'}</section><section class="detail">${category<2?`<div class="label">선택한 잉크</div><div class="detailHero"><img src="assets/${d.id}-jar.png"><div><h1 class="title">${d.name}</h1><p class="muted small">색상 잉크 · 1등급</p></div></div><div class="rule"></div><p>${d.description}</p><p class="muted small">${d.id==='ink3_red_01'?'재발동 간격 0.25초':''}</p><div class="hint">장착과 교체는 장비 탭에서</div>`:''}</section></div>`;footer.innerHTML='<span><kbd>X</kbd>버리기</span><span><kbd>X</kbd>3초 눌러 파괴</span><span class="muted">짧게 누르기 / 길게 누르기</span>';
}else{let current=data.find(x=>x.id===equipped[slot]);let sc=slotColors[slot];let candidates=data.map((x,i)=>({...x,index:i})).filter(x=>sc==='neutral'||x.color===sc);if(!candidates.some(x=>x.index===selected)){selected=candidates[0].index;d=data[selected]}document.documentElement.style.setProperty('--ink',colors[d.color]);let visible=candidates.slice(page*4,page*4+4);if(!visible.length){page=0;visible=candidates.slice(0,4)}content.innerHTML=`<div class="columns"><section><div class="weapons"><button onclick="weapon=0;render()" class="${weapon===0?'swash':''}"><img src="assets/sword.png">기본검</button><button onclick="weapon=1;render()" class="${weapon===1?'swash':''}"><img src="assets/hammer.png">기본망치</button></div><div class="stamps"><button onclick="stamp='무기';render()">무기 도장<strong>—</strong></button><button onclick="stamp='특수';render()">특수 도장<strong>—</strong></button></div><div class="rule"></div><div class="label">팔레트　<span class="muted small">5칸</span></div><div class="slots">${slotColors.map((c,i)=>{let id=equipped[i], ink=data.find(x=>x.id===id);return `<button class="slot ${slot===i&&!stamp?'focus':''}" onclick="slot=${i};page=0;stamp='';render()"><div class="layers"><img src="assets/${id?(c==='neutral'?'neutral-filled-':'filled-')+ink.color:'empty-'+c}.png">${id?`<img src="assets/${id}.png">`:''}</div><span>+0</span><strong class="slotname">${data.find(x=>x.id===id)?.name||'빈 칸'}</strong></button>`}).join('')}</div><div class="hint">칸을 선택해 장착 효과 확인</div></section><section>${stamp?`<div class="label">${stamp} 도장</div><h2 class="title">장착된 도장 없음</h2><p>—</p><div class="hint">도장 선택 시 설명을 보여주는 자리</div>`:`<div class="current"><div class="label">현재 장착　·　${slot+1}번 ${sc==='neutral'?'무색':''} 칸</div><h2>${current?.name||'—'}</h2><p>${current?.description||'장착된 잉크 없음'}</p></div><div class="transition"><img src="assets/transition-down.png" alt="교체 방향"></div><div class="label">교체할 잉크</div><div class="candidateRow"><button class="arrow" aria-label="이전 잉크" onclick="movePage(-1)" ${page===0?'disabled':''}><img src="assets/chevron-left.png" alt="이전"></button>${visible.map(x=>item(x,x.index,x.index===selected)).join('')}<button class="arrow" aria-label="다음 잉크" onclick="movePage(1)" ${(page+1)*4>=candidates.length?'disabled':''}><img src="assets/chevron-right.png" alt="다음"></button><span class="muted small">${page+1} / ${Math.ceil(candidates.length/4)}</span></div><div class="candidateDetail"><h2>${d.name} <span class="muted small">· 1등급</span></h2><p>${d.description}</p></div>`}</section></div>`;footer.innerHTML='<span><kbd>F</kbd>장착</span><span><kbd>Esc</kbd>이전 단계</span><span class="muted">시안 · 실제 아이템은 변경되지 않음</span>'}}
function movePage(delta){page+=delta;let c=slotColors[slot];let a=data.map((x,i)=>({...x,index:i})).filter(x=>c==='neutral'||x.color===c);selected=a[page*4].index;render()}bag.onclick=()=>{view='bag';render()};equip.onclick=()=>{view='equipment';selected=1;render()};function fit(){document.querySelector('.screen').style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}onresize=fit;fit();render();
</script></html>
