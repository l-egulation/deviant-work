<!doctype html><html lang="ko"><meta charset="utf-8"><title>Deviant · 출발 준비</title><style>
@font-face{font-family:Kkuk;src:url(../assembly-v1/fonts/MemomentKkukkukk.ttf)}*{box-sizing:border-box}body{margin:0;background:#24262b;color:#eee9df;font-family:Kkuk,sans-serif}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:none}img{object-fit:contain;image-rendering:pixelated}.screen{width:1920px;height:1080px;transform-origin:top left;position:relative;overflow:hidden}.world{position:absolute;inset:0;background:linear-gradient(#24262bf0,#24262bea),url(../screen-set-v6/assets/village.jpg) center/cover;filter:blur(1px)}main{position:relative;padding:85px 150px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:43px;font-weight:normal;margin:0}header span{color:#b3bbc4;font-size:25px}kbd{font:inherit;font-size:23px;border:1px solid #999da3;border-radius:5px;padding:4px 10px;margin-right:12px}.steps{display:flex;gap:55px;font-size:28px;color:#b3bbc4;margin-top:50px}.steps .active{color:#eee9df}.wash{position:relative;isolation:isolate}.wash:before{content:'';position:absolute;inset:-8px -18px;background:url(../maintenance-palette-v1/assets/selection-wash-v1.png) center/100% 100% no-repeat;opacity:.5;z-index:-1}.cols{display:grid;grid-template-columns:720px 1fr;gap:140px;margin-top:76px}.label{font-size:25px;color:#b3bbc4;margin:0 0 24px}.weapons{display:flex;flex-direction:column;gap:34px}.weapon{display:flex;align-items:center;gap:26px;height:110px;width:100%;font-size:32px}.weapon img{width:145px;height:100px}.weapon small{font-size:23px;color:#b3bbc4;margin-left:auto}.weapon.selected img{transform:scale(1.1)}.weapon.selected .name{transform:scale(1.1)}h2{font-size:37px;font-weight:normal;margin:0 0 22px}p{font-size:27px;line-height:1.65;margin:0 0 25px}.muted{color:#b3bbc4}.rule{height:1px;background:#a8afb640;margin:30px 0}.actionRow{display:flex;gap:26px;align-items:center;border-top:1px solid #a8afb640;padding-top:25px;margin-top:32px}.actionRow button{font-size:30px;color:#b5d8e4;white-space:nowrap}.actionRow span{font-size:24px}.focus{filter:brightness(1.15)}.actionRow .focus{transform:scale(1.1);transform-origin:left center}.loadout{display:flex;gap:60px;margin-top:45px}.loadout div{font-size:25px}.loadout img{display:block;width:130px;height:80px;margin:12px 0}.palette{display:flex;gap:14px;margin:28px 0 40px}.palette figure{margin:0;text-align:center;width:112px}.palette img{width:112px;height:95px}.palette figcaption{font-size:22px;color:#b3bbc4;margin-top:12px}.weaponSummary{display:flex;align-items:center;gap:25px}.weaponSummary img{width:145px;height:100px}.gold{color:#e0cc83}.remaining{font-size:26px!important}.footer{position:absolute;left:150px;right:150px;bottom:55px;border-top:1px solid #a8afb640;padding-top:24px;font-size:24px;color:#b3bbc4;display:flex;justify-content:space-between}.saved{margin:60px auto 0;width:1400px}.saved .loadout{margin-top:25px;margin-bottom:20px}.saved .palette{margin:15px 0 10px}.saved .actionRow{margin-top:20px}.saved .readyText{margin-bottom:14px}.readyText{font-size:34px}.selected .name{display:inline-block}.small{font-size:23px}.confirm button{font-size:29px}.confirm{display:flex;gap:55px;margin-top:30px}
.miniPalette{display:flex;gap:4px;margin-left:auto}.weapon .miniPalette img{width:48px;height:45px;transform:none}.weapon small{font-size:20px;margin-left:8px}.weapon{gap:18px}.selected .miniPalette{filter:brightness(1.15)}button:focus-visible{outline:1px solid #b5d8e4;outline-offset:8px}.saved .actionRow{gap:65px}</style><div class="screen"><div class="world"></div><main id="main"></main><footer class="footer" id="footer"></footer></div><script>
const q=new URLSearchParams(location.search),extended=q.get('slots')==='5',unlocked=extended||q.get('reroll')==='1';let phase=q.get('view')||'choose',step=q.get('step')==='2'?1:0,selection=[0,2],hover=0,weapon=0,zone=0,actionIndex=0,saved=false,remaining=unlocked?2:0,prompt=false;
let palettes=extended?[['neutral','red','yellow','blue','purple'],['neutral','green','blue','red','yellow'],['neutral','purple','red','green','blue']]:[['red','yellow','blue'],['green','blue','purple'],['purple','red','green']];
if(q.get('restart')==='1'){const pool=['red','yellow','green','blue','purple'];palettes=palettes.map(row=>row.map(c=>c==='neutral'?c:pool[Math.floor(Math.random()*pool.length)]));phase='choose';step=0;hover=0;saved=false;}
const weapons=[{name:'기본검',file:'base_sword',desc:'전방의 적을 베는 근접 무기입니다.',basic:'베기',skill:'강베기'},{name:'기본 둔기',file:'hammer',desc:'묵직한 타격으로 가까운 적을 공격하는 근접 무기입니다.',basic:'내려치기',skill:'기본 특수 공격'},{name:'발사기',file:'launcher',desc:'직선으로 볼 탄환을 쏘는 원거리 무기입니다.',basic:'볼 탄환',skill:'모아쏘기'}],names={neutral:'무색',red:'빨강',yellow:'노랑',green:'초록',blue:'파랑',purple:'보라'};const A='../screen-set-v6/assets/';
const icon=w=>`<img src="${A}weapon-${weapons[w].file}.png" alt="${weapons[w].name}">`;const key=k=>`<kbd>${k}</kbd>`;
function slots(i){return `<div class="palette">${palettes[selection[i]].map(c=>`<figure><img src="${A}empty-${c}.png" alt="${names[c]} 빈 칸"><figcaption>${names[c]}</figcaption></figure>`).join('')}</div>`}
function render(){const w=weapons[phase==='choose'?hover:selection[weapon]];main.innerHTML=`<header><h1>출발 준비</h1><span>${key('Esc')}이전 단계</span></header><div class="steps"><span class="${phase==='choose'?'active wash':''}">도면 선택</span><span>→</span><span class="${phase==='palette'?'active wash':''}">${phase==='palette'?'팔레트 변경':'준비 저장'}</span></div>`;footer.innerHTML=`<span>방향키 이동　·　F 선택　·　Esc 이전 단계</span><span>출발은 마을의 이정표에서</span>`;
if(phase==='choose'){main.innerHTML+=`<div class="cols"><section><p class="label">무기 ${step+1}의 도면</p><div class="weapons">${weapons.map((x,i)=>`<button class="weapon ${hover===i?'selected':''}" ${step===1&&selection[0]===i?'disabled':''} onclick="hover=${i};choose()">${icon(i)}<span class="name ${hover===i&&zone===0?'wash':''}">${x.name}</span><span class="miniPalette">${palettes[i].map(c=>`<img src="${A}empty-${c}.png" alt="${names[c]}">`).join('')}</span>${step===1&&selection[0]===i?'<small>무기 1에서 선택</small>':''}</button>`).join('')}</div><p class="muted small" style="margin-top:38px">팔레트 색을 보고 서로 다른 도면 두 개를 선택합니다.</p></section><section><p class="label">도면 정보</p><h2>${w.name}</h2><p>${w.desc}</p><div class="rule"></div><p>기본 공격 · ${w.basic}</p><p>스킬 · ${w.skill}</p><div class="actionRow"><button class="${zone===1?'focus wash':''}" onclick="choose()">${key('F')}무기 ${step+1}로 선택</button></div>${step===1?`<div class="loadout"><div><span class="muted">무기 1</span>${icon(selection[0])}${weapons[selection[0]].name}</div></div>`:''}</section></div>`;}
else if(phase==='palette'){main.innerHTML+=`<div class="cols"><section><p class="label">출발 무기</p><div class="weapons">${selection.map((x,i)=>`<button class="weapon ${weapon===i?'selected':''}" onclick="weapon=${i};zone=0;render()">${icon(x)}<span class="name ${weapon===i&&zone===0?'wash':''}">${weapons[x].name}</span><small>무기 ${i+1}</small></button>`).join('')}</div><div class="rule"></div><p>팔레트 ${extended?5:3}칸 <span class="muted small">· 잉크가 없는 빈 칸으로 시작</span></p><p class="small">${extended?'첫 칸은 무색 · 모든 색 잉크 장착 가능':'각 칸에는 같은 색의 잉크를 장착합니다.'}</p></section><section><p class="label">무기 ${weapon+1} · 시작 팔레트</p>${slots(weapon)}<p class="remaining">${unlocked?'다시 뽑기　남은 '+remaining+'회':'다시 뽑기 미해금'}</p><p class="muted small">${unlocked?'선택한 무기의 칸 색 전체를 다시 뽑습니다.'+(extended?'<br>첫 번째 무색 칸은 유지됩니다.':''):'염색공방에서 해금할 수 있습니다.'}</p>${prompt?`<p>다시 뽑기 1회를 사용할까요?</p><div class="confirm"><button onclick="prompt=false;render()">취소</button><button onclick="reroll()">${key('F')}다시 뽑기</button></div>`:`<div class="actionRow"><button ${!remaining?'disabled':''} class="${zone===1&&actionIndex===0?'focus wash':''}" onclick="reroll()">${key('F')}다시 뽑기</button></div><div class="actionRow"><button class="${zone===1&&actionIndex===1?'focus wash':''}" onclick="save()">${key('F')}준비 화면으로</button><span></span></div>`}</section></div>`;}
else{main.innerHTML+=`<section class="saved"><h2>출발 준비가 되었습니다</h2><div class="loadout">${selection.map((x,i)=>`<div><span class="muted">무기 ${i+1}</span>${icon(x)}${weapons[x].name}${slots(i)}</div>`).join('')}</div><p class="readyText">마을의 출발 이정표에서 ${key('F')}</p><p class="muted">이정표를 사용하면 1챕터로 이동합니다.</p><div class="actionRow"><button class="${actionIndex===0?'wash':''}" onclick="phase='choose';step=0;hover=selection[0];zone=0;render()">도면 다시 선택</button>${unlocked?`<button ${remaining===0?'disabled':''} onclick="phase='palette';zone=0;render()">팔레트 변경 <span class="small muted">· 남은 ${remaining}회</span></button>`:''}</div></section>`;}}
function choose(){if(step===1&&hover===selection[0])return;selection[step]=hover;if(step===0){step=1;hover=[0,1,2].find(i=>i!==selection[0]);zone=0}else{saved=true;phase='ready';weapon=0;zone=0}render()}
function reroll(){if(remaining<=0)return;const colors=['red','yellow','green','blue','purple'];palettes[selection[weapon]]=palettes[selection[weapon]].map(c=>c==='neutral'?c:colors[Math.floor(Math.random()*5)]);remaining--;prompt=false;render()}
function save(){saved=true;phase='ready';render()}
let cursor=0;document.addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key;if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','f','F','Enter','Escape'].includes(k))return;e.preventDefault();if(k==='Escape'){if(phase==='palette')phase='ready';else if(phase==='ready'){phase='choose';step=0;hover=selection[0]}else if(step){step=0;hover=selection[0]}cursor=0;render();return}const buttons=[...main.querySelectorAll('button:not(:disabled)')];if(k.startsWith('Arrow')){cursor=(cursor+(['ArrowDown','ArrowRight'].includes(k)?1:-1)+buttons.length)%buttons.length;if(phase==='choose'&&buttons[cursor]?.classList.contains('weapon')){hover=[...main.querySelectorAll('.weapon')].indexOf(buttons[cursor]);render();main.querySelectorAll('button:not(:disabled)')[cursor]?.focus()}else buttons[cursor]?.focus();return}const target=buttons.includes(document.activeElement)?document.activeElement:buttons[Math.min(cursor,buttons.length-1)];target?.click();cursor=0;});
function fit(){document.querySelector('.screen').style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}onresize=fit;fit();render();
</script></html>
