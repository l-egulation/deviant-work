<!doctype html><html lang="ko"><meta charset="utf-8"><title>잉크 문양·증강 전체</title><link rel="stylesheet" href="style.css"><style>
body{overflow:auto;background:#24272c}.board{width:100%;max-width:1600px;padding:55px 70px;margin:auto}.board h1{font-size:42px;margin-bottom:35px}.board h2{font-size:34px;margin:60px 0 30px}.board p{color:#bfc7cf;font-size:23px}.assetGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:25px 35px}.assetCell{text-align:center;padding:20px 10px;border-bottom:1px solid #aab5c32b}.assetCell .preview{display:flex;align-items:center;justify-content:center;height:155px;background:#ece5d5;margin-bottom:22px}.assetCell .spriteIcon{width:135px;height:135px}.assetCell h3{font-size:28px;margin:0 0 12px}.assetCell p{font-size:22px;margin:0;line-height:1.5}.augGrid{grid-template-columns:repeat(3,1fr)}.augGrid .preview{background:#30343b}.footerNote{margin-top:35px}
</style><div class="board"><h1>잉크 문양 · 전체 12종</h1><p>기절·추격은 얼굴 없이 별과 회전 궤적으로 표현합니다.</p><div id="inks" class="assetGrid"></div><h2>증강 · 전체 3종</h2><div id="augs" class="assetGrid augGrid"></div><p class="footerNote">현재 UI 시안 기준 · 효과의 상세 조건과 수치는 설명 영역에서 확인</p></div><script src="village-ui.js"></script><script>
const inks=[['기절 잉크','기절 상태'],['추격 잉크','기절 대상 · 기본 공격'],['집중 잉크','기절 대상 · 스킬'],['보호 잉크','대시 · 보호막'],['질주 잉크','무기 전환 · 이동 속도'],['속박 잉크','발을 묶는 효과'],['맹공 잉크','속박 대상 · 기본 공격'],['순환 잉크','스킬 쿨타임 감소'],['회복 잉크','체력 회복'],['가속 잉크','이동 속도 증가'],['둔화 잉크','이동 속도 감소'],['독기 잉크','중독 대상 · 기본 공격']];
function cell(x,i){return `<div class="assetCell"><div class="preview">${spriteIcon(i)}</div><h3>${x[0]}</h3><p>${x[1]}</p></div>`}document.querySelector('#inks').innerHTML=inks.map(cell).join('');document.querySelector('#augs').innerHTML=[['단단한 기초','공격력 증가 · 패널티 없음'],['유리 칼날','공격력 증가 · 최대 체력 감소'],['마지막 불꽃','낮은 체력에서 스킬 강화 · 회복 감소']].map((x,i)=>cell(x,i+12)).join('');
</script><script src="../review-font.js"></script></html>
