<script>const q=new URLSearchParams(location.search),s=document.querySelector('#screen');s.classList.toggle('dark',q.get('scene')==='dark'||q.get('state')==='boss');s.classList.toggle('boss',q.get('state')==='boss');s.classList.toggle('pickup',q.get('state')==='pickup');function fit(){s.style.transform=`scale(${Math.min(innerWidth/960,innerHeight/540)})`}onresize=fit;fit();document.querySelectorAll('.skill').forEach(b=>b.onclick=()=>{if(b.dataset.running)return;b.dataset.running='1';const start=performance.now(),duration=6000;function tick(now){const left=Math.max(0,duration-(now-start));b.querySelector('.cooldown').style.height=(left/duration*100)+'%';b.querySelector('.time').textContent=left?(left/1000).toFixed(1):'';if(left)requestAnimationFrame(tick);else delete b.dataset.running}requestAnimationFrame(tick)});</script><script src="../review-font.js"></script></html>
