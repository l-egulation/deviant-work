<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>측면 컷 정합 비교</title><style>body{margin:0;background:#161b20;color:#eee9de;font:16px/1.6 system-ui}main{max-width:1500px;margin:auto;padding:25px}button,select{padding:10px;margin:4px;background:#303c44;color:white;border:1px solid #758089;border-radius:5px}canvas{width:100%;height:auto;display:block;background:#111}p{color:#bdc6cb}.controls{position:sticky;top:0;background:#161b20ee;padding:10px 0}#name{font-size:22px}small{color:#b9b5aa}</style><main><h1>측면 장면 · 몬스터 축소 v3</h1><p>모든 화면 1672×470. 마을 달리기의 후드 폭·몸통 중심·발바닥 기준으로 배율과 위치를 개별 배치했습니다. 몸통 기준은 자세별 수동 지정입니다. 머리 모양·팔·다리 자세까지 동일하다는 뜻은 아닙니다.</p><div class="controls"><select id="pick"></select><button id="prev">이전</button><button id="next">다음</button><button id="play">자동 비교</button><button id="guides">기준선 표시 / 숨김</button><button id="download">현재 컷 PNG 저장</button></div><h2 id="name"></h2><canvas id="view" width="1672" height="470"></canvas><p id="info"></p><small>양옆 배경을 확장한 배치 검토본입니다. 동일한 목표 기준값을 유지하고 새 그림의 수동 기준점을 다시 지정했습니다. 일부 상단 벽면은 같은 원본의 가장자리로 연장했습니다. 저장하는 PNG에는 기준선이 포함되지 않습니다. 자동 비교는 모션 시험이나 실제 편집 순서가 아닙니다.</small></main><script>const scenes=[{"name": "마을 달리기 · 기준", "src": "run", "crop": [0, 0, 1672, 470], "head": 96, "x": 717, "foot": 419, "scale": 1.0, "dx": 0.0, "dy": 0.0}, {"name": "수로 달리기", "src": "run", "crop": [0, 470, 1672, 471], "head": 96, "x": 717, "foot": 409, "scale": 1.0, "dx": 0.0, "dy": 10.0}, {"name": "수로 · 받아내기", "src": "canal", "crop": [0, 0, 1774, 444], "head": 82, "x": 840, "foot": 363, "scale": 1.170731707317073, "dx": -266.4146341463414, "dy": -5.975609756097526}, {"name": "수로 · 반격", "src": "canal", "crop": [0, 444, 1774, 443], "head": 88, "x": 870, "foot": 361, "scale": 1.0909090909090908, "dx": -232.090909090909, "dy": 25.181818181818187}, {"name": "도시 · 흔적 발견", "src": "city", "crop": [0, 0, 1672, 470], "head": 86, "x": 681, "foot": 396, "scale": 1.1162790697674418, "dx": -43.186046511627865, "dy": -23.046511627906966}, {"name": "도시 · 흔적 확인", "src": "city", "crop": [0, 470, 1672, 471], "head": 84, "x": 715, "foot": 394, "scale": 1.1428571428571428, "dx": -100.14285714285711, "dy": -31.285714285714278}];const sources={"run": "board-run-match_v3.png", "canal": "board-canal-background_v3.png", "city": "board-city-background_v1.png"};let index=0,guide=true,timer=null;const cv=document.getElementById('view'),ctx=cv.getContext('2d'),imgs={};const pick=document.getElementById('pick');scenes.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name;pick.appendChild(o)});function paint(c,g){const s=scenes[index];c.fillStyle='#242a30';c.fillRect(0,0,1672,470);c.strokeStyle='#434a50';c.lineWidth=1;for(let x=-470;x<1700;x+=24){c.beginPath();c.moveTo(x,0);c.lineTo(x+470,470);c.stroke()}if(s.dy>0){c.drawImage(imgs[s.src],s.crop[0],s.crop[1]+2,s.crop[2],32,s.dx,0,s.crop[2]*s.scale,s.dy+1)}c.drawImage(imgs[s.src],...s.crop,s.dx,s.dy,s.crop[2]*s.scale,s.crop[3]*s.scale);if(g){c.setLineDash([8,6]);c.lineWidth=2;c.strokeStyle='#66efbf';c.beginPath();c.moveTo(717,0);c.lineTo(717,470);c.moveTo(0,419);c.lineTo(1672,419);c.stroke();c.setLineDash([])}}function render(){paint(ctx,guide);pick.value=index;document.getElementById('name').textContent=scenes[index].name;document.getElementById('info').textContent='후드 폭 기준 96px · 몸통 중심 x717 · 발바닥 y419 · 배율 '+scenes[index].scale.toFixed(4)+' (원본 픽셀 기준)'}pick.onchange=()=>{index=+pick.value;render()};document.getElementById('prev').onclick=()=>{index=(index+5)%6;render()};document.getElementById('next').onclick=()=>{index=(index+1)%6;render()};document.getElementById('guides').onclick=()=>{guide=!guide;render()};document.getElementById('play').onclick=function(){if(timer){clearInterval(timer);timer=null;this.textContent='자동 비교'}else{timer=setInterval(()=>{index=(index+1)%6;render()},1100);this.textContent='멈춤'}};document.getElementById('download').onclick=()=>{const c=document.createElement('canvas');c.width=1672;c.height=470;paint(c.getContext('2d'),false);const a=document.createElement('a');a.download='side-match-filled-'+String(index+1).padStart(2,'0')+'_v2.png';a.href=c.toDataURL('image/png');a.click()};Promise.all(Object.entries(sources).map(([k,v])=>new Promise((resolve,reject)=>{const im=new Image();imgs[k]=im;im.onload=resolve;im.onerror=reject;im.src=v}))).then(render);</script></html>
